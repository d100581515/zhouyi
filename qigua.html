<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="起卦">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>起卦</title>
<style>
:root{--bg:#f6f1e7;--card:#fbf8f1;--ink:#1f1b16;--sub:#6e6559;--acc:#9a6b2f;--line:#e2d8c5;
 --ff:"Songti TC","STSong","Noto Serif CJK TC",serif;--sf:-apple-system,"PingFang TC","Noto Sans CJK TC",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#16130f;--card:#221d17;--ink:#e9e1d3;--sub:#b2a794;--acc:#d3a35f;--line:#3a3128}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sf);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit}
.view{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:var(--bg)}
.view.on{display:flex}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 2px;min-height:48px}
.top a,.top button{color:var(--acc);text-decoration:none;background:none;border:0;font-size:15px;padding:6px 4px;min-width:64px;text-align:left}
.top .r{text-align:right}
.ttl{font-family:var(--ff);font-size:22px;font-weight:600;letter-spacing:.3em;margin-right:-.3em}
.hint{text-align:center;font-size:13px;color:var(--sub);min-height:20px;margin:2px 16px 0}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 14px;min-height:0}
.rods{flex:1;max-width:420px;display:flex;flex-direction:column;gap:12px}
.rods canvas{width:100%;height:54px;display:block;border-radius:6px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.side{display:flex;flex-direction:column;gap:12px;width:54px;opacity:0;pointer-events:none;transition:opacity .3s}
.side.on{opacity:1;pointer-events:auto}
.sb{width:54px;height:54px;border-radius:12px;background:var(--card);border:.5px solid color-mix(in srgb,var(--acc) 40%,transparent);color:var(--acc);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;padding:0}
.sb b{font-family:var(--ff);font-size:19px;line-height:1;font-weight:600}
.cap{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:4px 16px;
 opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s}
.cap.on{opacity:1;transform:none}
.cap .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;justify-content:center}
.cap .nm{font-family:var(--ff);font-size:26px;font-weight:600}
.cap .mn{font-family:var(--ff);font-size:17px;color:var(--sub)}
.cap .row.sub .nm{font-size:19px}.cap .row.sub .mn{font-size:14px}
.tag{font-size:12px;color:var(--acc);border:.5px solid var(--acc);border-radius:4px;padding:0 5px}
.bottom{display:flex;gap:12px;padding:10px 18px 14px}
.pri,.sec{flex:1;font-size:17px;font-weight:600;padding:14px 0;border-radius:14px;border:0}
.pri{background:var(--acc);color:#fff}
.sec{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.pri:disabled,.sec:disabled{opacity:.45}
/* 銅錢 */
.coins{display:flex;justify-content:center;gap:16px;height:178px;align-items:flex-end;padding-bottom:6px}
.coins canvas{width:96px;height:172px}
.build{flex:1;max-width:300px;display:flex;flex-direction:column;gap:12px}
.slot{height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px}
.slot.fill{background:var(--card)}
.slot .ln{flex:1;height:20px;display:flex;gap:16%}
.slot .ln i{flex:1;background:#121212;border-radius:3px}
@media (prefers-color-scheme:dark){.slot .ln i{background:#e9e1d3}}
.slot .ln.empty{border:1px dashed color-mix(in srgb,var(--sub) 45%,transparent);border-radius:4px;height:22px}
.slot .mk{width:20px;text-align:center;font-weight:700;font-size:19px}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* 面板 */
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .25s}
.sheet.show .bd{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--bg);border-radius:18px 18px 0 0;
 display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
 padding-bottom:env(safe-area-inset-bottom);-webkit-user-select:text;user-select:text}
.sheet.show .panel{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.ph button{background:none;border:0;color:var(--acc);font-size:16px;font-weight:600;padding:6px 2px}
.pb{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 26px}
.hh{display:flex;align-items:center;gap:16px;margin:4px 0 14px}
.glyph{display:flex;flex-direction:column;gap:5px;width:64px}
.glyph .g{display:flex;align-items:center;gap:5px}
.glyph .g .ln{flex:1;height:7px;display:flex;gap:18%}
.glyph .g .ln i{flex:1;background:var(--ink);border-radius:2px}
.glyph .g s{width:10px;font-size:11px;color:var(--acc);text-decoration:none;font-weight:700;text-align:center}
.hh .role{font-size:12px;color:var(--acc)}
.hh .t{font-family:var(--ff);font-size:22px;font-weight:600}
.hh .m{font-family:var(--ff);font-size:16px;color:var(--acc);margin-top:2px}
.hh .tr{font-size:12px;color:var(--sub);margin-top:2px}
.card{background:var(--card);border-radius:14px;border:.5px solid color-mix(in srgb,var(--acc) 18%,transparent);padding:14px 16px;margin:0 0 12px}
.card.hi{border:1.5px solid var(--acc)}
.card .ct{font-size:13px;font-weight:600;color:var(--acc);display:flex;gap:8px;align-items:center}
.card .ct em{font-style:normal;font-size:11px;color:#fff;background:var(--acc);border-radius:9px;padding:1px 7px}
.card .tx{font-family:var(--ff);font-size:19px;font-weight:600;line-height:1.7;margin:6px 0 8px}
.card .lb{display:flex;gap:8px;align-items:baseline;font-size:15px;line-height:1.7;color:var(--sub);margin-top:4px}
.card .lb span{flex:none;font-size:11px;color:var(--acc);border:.5px solid var(--acc);border-radius:3px;padding:0 4px}
.rule{font-size:15px;line-height:1.7;margin:2px 0 10px}
.sec-t{font-size:15px;font-weight:600;margin:16px 0 10px}
.cmp{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.cmp .mini{flex:1;background:var(--card);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.cmp .mini .glyph{width:54px}
.cmp .mini b{font-family:var(--ff);font-size:17px}
.cmp .mini small{font-size:12px;color:var(--sub)}
.cmp .ar{color:var(--acc);font-size:20px}
.more{display:block;text-align:center;margin:8px 0 4px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);text-decoration:none;font-weight:600}
.note{font-size:14px;color:var(--sub);line-height:1.7}
</style></head>
<body>

<!-- ===== 八面柱起卦 ===== -->
<section id="main" class="view on">
 <div class="top"><a href="index.html">‹ 周易本義</a><span class="ttl">起卦</span><span style="min-width:64px"></span></div>
 <div class="hint" id="hint">心中默念所問之事，向上滑動或按「起卦」</div>
 <div class="stage" id="stage">
  <div class="rods" id="rods"></div>
  <div class="side" id="side"></div>
 </div>
 <div class="cap" id="cap"></div>
 <div class="bottom">
  <button class="pri" id="castBtn">起卦</button>
  <button class="sec" id="coinBtn">銅錢起卦</button>
 </div>
</section>

<!-- ===== 銅錢起卦 ===== -->
<section id="coinView" class="view">
 <div class="top"><button id="coinClose">‹ 返回</button><span class="ttl">銅錢</span><span style="min-width:64px"></span></div>
 <div class="coins" id="coins"></div>
 <div class="hint" id="coinHint"></div>
 <div class="stage">
  <div class="build" id="build"></div>
  <div class="side" id="coinSide"></div>
 </div>
 <div class="cap" id="coinCap"></div>
 <div class="bottom"><button class="pri" id="tossBtn">擲銅錢</button></div>
</section>

<!-- ===== 資訊面板 ===== -->
<div class="sheet" id="sheet">
 <div class="bd" id="sheetBd"></div>
 <div class="panel">
  <div class="grab"></div>
  <div class="ph"><span id="sheetTitle" style="font-size:15px;color:var(--sub)"></span><button id="sheetDone">完成</button></div>
  <div class="pb" id="sheetBody"></div>
 </div>
</div>

<script>
const HEX = [{"n":1,"name":"乾","sym":"䷀","lower":"乾","upper":"乾","lines":[1,1,1,1,1,1],"meaning":"剛健自強，順時而進","judgment":{"text":"乾，元亨利貞。","plain":"乾卦象徵天，剛健不息。占得此卦，事情能大為亨通，但必須守持正道、堅定不移，才會有利。","insight":"做事要有開創的魄力，但成功的前提是守正與堅持；有能力的人更要走正路。"},"image":{"text":"《象》曰：天行健，君子以自強不息。","plain":"《象傳》說：天的運行剛健不停，君子效法它，自己奮發圖強、永不停息。"},"yao":[{"pos":"初九","text":"初九，潛龍勿用。","plain":"初九：龍還潛藏在深處，時機未到，不宜有所作為。","insight":"能力未成、時機未到時，沉潛蓄積比急於表現更重要。"},{"pos":"九二","text":"九二，見龍在田，利見大人。","plain":"九二：龍已出現在田野上，才德漸顯，適合去見有德有位的大人。","insight":"才華初露，應主動尋找賞識你的貴人或良師。"},{"pos":"九三","text":"九三，君子終日乾乾，夕惕若厲，无咎。","plain":"九三：君子整天勤奮不懈，到了晚上仍警惕自省，處境雖然危險，卻不會有過失。","insight":"處在上下交界的關鍵位置，日夜勤勉、時時自省，才能化險為夷。"},{"pos":"九四","text":"九四，或躍在淵，无咎。","plain":"九四：龍或躍起、或仍留在深淵，進退可以自己斟酌，不會有過失。","insight":"面臨進退抉擇時，可以試探、評估，不必勉強躍進。"},{"pos":"九五","text":"九五，飛龍在天，利見大人。","plain":"九五：龍飛騰在天上，正居尊位，有利於見到大德之人，也利於天下人來見他。","insight":"時機與地位俱佳，是發揮影響力的巔峰，宜廣納賢才。"},{"pos":"上九","text":"上九，亢龍有悔。","plain":"上九：龍飛得太高、過了頭，必定會有懊悔。","insight":"盛極必衰，懂得收手和謙退，才能避免後悔。"},{"pos":"用九","text":"用九，見群龍无首，吉。","plain":"用九：六爻全是陽爻，看到一群龍卻不爭著當首領，這是吉祥的。","insight":"群龍無首，人人剛健卻不爭先，團隊各盡其才最為理想。"}]},{"n":2,"name":"坤","sym":"䷁","lower":"坤","upper":"坤","lines":[0,0,0,0,0,0],"meaning":"柔順厚德，承載包容","judgment":{"text":"坤，元亨，利牝馬之貞。君子有攸往，先迷後得，主利。西南得朋，東北喪朋。安貞吉。","plain":"坤卦象徵地，柔順承天。大為亨通，利於像母馬那樣柔順而堅持正道。君子有所前往，搶先就會迷失，跟隨在後就能有所得，而且主於有利。往西南會得到朋友，往東北會失去朋友。安然守正就吉祥。","insight":"不爭主導，甘當輔佐，跟隨正確的方向反而有所得；安於正道就吉祥。"},"image":{"text":"《象》曰：地勢坤，君子以厚德載物。","plain":"《象傳》說：地勢柔順，這就是坤；君子效法它，以深厚的德行包容承載萬物。"},"yao":[{"pos":"初六","text":"初六，履霜，堅冰至。","plain":"初六：腳下踩到薄霜，就知道堅硬的冰快要來了。","insight":"見微知著，小問題不處理，終會累積成大麻煩。"},{"pos":"六二","text":"六二，直方大，不習无不利。","plain":"六二：正直、端方、廣大，不必刻意學習，也沒有不利的。","insight":"內心正直、行事端方、胸懷廣大，自然水到渠成。"},{"pos":"六三","text":"六三，含章可貞，或從王事，无成有終。","plain":"六三：內含美德而不外露，可以守持正道；如果去輔佐君王做事，不居功成名，卻能把事情做到最後。","insight":"有才不炫，輔佐他人成事而不居功，終能善始善終。"},{"pos":"六四","text":"六四，括囊，无咎，无譽。","plain":"六四：把袋口紮緊，言行謹慎收斂，沒有過失，也沒有讚譽。","insight":"局勢不明時謹言慎行，雖無功勞也不招禍。"},{"pos":"六五","text":"六五，黃裳，元吉。","plain":"六五：穿著黃色的下裳，居中而謙下，非常吉祥。","insight":"身居高位而謙和低調，是最大的吉祥。"},{"pos":"上六","text":"上六，龍戰于野，其血玄黃。","plain":"上六：龍在郊野爭戰，流出的血有黑有黃，兩敗俱傷。","insight":"柔弱者勢力過盛而與強者硬碰，必然兩敗俱傷。"},{"pos":"用六","text":"用六，利永貞。","plain":"用六：六爻全是陰爻，利於永遠守持正道。","insight":"柔順的人要長久堅守正道，才能有好的歸宿。"}]},{"n":3,"name":"屯","sym":"䷂","lower":"震","upper":"坎","lines":[1,0,0,0,1,0],"meaning":"萬事起頭難，草創需扶持","judgment":{"text":"屯，元亨，利貞。勿用有攸往，利建侯。","plain":"屯卦象徵事物初生時的艱難。能夠大為亨通，但利於守持正道。不宜輕易有所前往，適合建立諸侯、尋求輔助。","insight":"新事業初創時困難重重，不宜貿然擴張，應先建立團隊、尋求支援。"},"image":{"text":"《象》曰：雲雷，屯，君子以經綸。","plain":"《象傳》說：上有雲、下有雷，這就是屯；君子效法它，整理規劃天下大事。"},"yao":[{"pos":"初九","text":"初九，磐桓，利居貞，利建侯。","plain":"初九：徘徊難進，利於安居守正，適合建立諸侯。","insight":"起步艱難時，穩住根基、謙下待人，就能凝聚人心。"},{"pos":"六二","text":"六二，屯如邅如，乘馬班如，匪寇婚媾，女子貞不字，十年乃字。","plain":"六二：處境艱難，進退迴旋，騎著馬又徘徊不前。來的不是強盜，而是來求婚的人；女子守正不肯答應，要等十年之後才許嫁。","insight":"面對誘惑或壓力，堅守原則、耐心等待，好的機緣終會到來。"},{"pos":"六三","text":"六三，即鹿无虞，惟入于林中，君子幾，不如舍，往吝。","plain":"六三：追逐鹿而沒有熟悉山林的嚮導，只會迷入樹林深處。君子察覺到這個徵兆，不如放棄，前往會有憾惜。","insight":"沒有準備和嚮導就貿然追逐目標，不如及時放手。"},{"pos":"六四","text":"六四，乘馬班如，求婚媾，往吉，无不利。","plain":"六四：騎著馬徘徊不前，去求得婚配，前往吉祥，沒有不利的。","insight":"自己力量不足時，主動尋求合作夥伴，前往則吉。"},{"pos":"九五","text":"九五，屯其膏，小貞吉，大貞凶。","plain":"九五：恩澤難以廣施；小事守正吉祥，大事堅持則有兇險。","insight":"資源有限時，先從小處著手；急於大施大為反而有害。"},{"pos":"上六","text":"上六，乘馬班如，泣血漣如。","plain":"上六：騎著馬徘徊不前，哭得血淚漣漣。","insight":"困境中無力突破又無援助，悲傷無益，必須另謀出路。"}]},{"n":4,"name":"蒙","sym":"䷃","lower":"坎","upper":"艮","lines":[0,1,0,0,0,1],"meaning":"啟蒙教育，以正養蒙","judgment":{"text":"蒙，亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。","plain":"蒙卦象徵蒙昧與啟蒙，可以亨通。不是我去求蒙昧的孩童，而是蒙昧的孩童來求我。第一次誠心占問就告訴他，一再重複占問就是褻瀆，褻瀆就不告訴他。利於守持正道。","insight":"求學要主動且真誠；老師不必強求學生，學生一再敷衍提問則不必回答。"},"image":{"text":"《象》曰：山下出泉，蒙，君子以果行育德。","plain":"《象傳》說：山下湧出泉水，這就是蒙；君子效法它，以果決的行動培育德行。"},"yao":[{"pos":"初六","text":"初六，發蒙，利用刑人，用說桎梏，以往吝。","plain":"初六：啟發蒙昧，要適時用刑罰來警戒人，使他脫去手銬腳鐐般的束縛；若一直依賴刑罰下去，就會有憾惜。","insight":"啟蒙之初需要適度的規範與約束，但不可一味嚴懲。"},{"pos":"九二","text":"九二，包蒙，吉，納婦，吉，子克家。","plain":"九二：包容蒙昧之人，吉祥；娶妻，吉祥；兒子能夠承擔家事。","insight":"教育者要有包容心，能接納不同程度的學生。"},{"pos":"六三","text":"六三，勿用取女，見金夫，不有躬，无攸利。","plain":"六三：不要娶這樣的女子，她見到有錢的男子就失去自身操守，娶她沒有什麼好處。","insight":"見利忘義、輕易動搖的人，不宜與之結合。"},{"pos":"六四","text":"六四，困蒙，吝。","plain":"六四：困於蒙昧之中，有憾惜。","insight":"遠離良師益友而困於無知，令人遺憾。"},{"pos":"六五","text":"六五，童蒙，吉。","plain":"六五：像孩童般純樸蒙昧而虛心求教，吉祥。","insight":"保持孩童般虛心求教的態度，是學習的最佳狀態。"},{"pos":"上九","text":"上九，擊蒙，不利為寇，利禦寇。","plain":"上九：嚴厲地打擊蒙昧，但不宜過度像盜寇般暴虐，只宜用來防禦外來的侵害。","insight":"糾正錯誤要嚴，但目的是防止危害，而非報復傷人。"}]},{"n":5,"name":"需","sym":"䷄","lower":"乾","upper":"坎","lines":[1,1,1,0,1,0],"meaning":"耐心等待，蓄勢待時","judgment":{"text":"需，有孚，光亨，貞吉，利涉大川。","plain":"需卦象徵等待。心中有誠信，就能光明亨通；守持正道吉祥，利於渡過大河、涉越險難。","insight":"時機未到時，保持誠信與耐心，前景光明；準備充足才能突破險阻。"},"image":{"text":"《象》曰：雲上於天，需，君子以飲食宴樂。","plain":"《象傳》說：雲氣升到天上，尚未成雨，這就是需；君子效法它，安心飲食宴樂，靜待時機。"},"yao":[{"pos":"初九","text":"初九，需于郊，利用恒，无咎。","plain":"初九：在遠離險難的郊外等待，利於保持恆常不變，沒有過失。","insight":"危險尚遠時，安守常態、不冒進，就不會出錯。"},{"pos":"九二","text":"九二，需于沙，小有言，終吉。","plain":"九二：在沙灘上等待，稍微受到一些言語責難，最終吉祥。","insight":"漸近險境，難免有閒話，但心胸寬裕終能吉祥。"},{"pos":"九三","text":"九三，需于泥，致寇至。","plain":"九三：在泥濘中等待，已逼近險地，招致盜寇到來。","insight":"自己逼近危險，等於招來禍患，唯有敬慎可免失敗。"},{"pos":"六四","text":"六四，需于血，出自穴。","plain":"六四：在血泊般的傷害中等待，最終能從險穴中脫出。","insight":"已身陷困境，順應形勢、聽從指引，可以脫險。"},{"pos":"九五","text":"九五，需于酒食，貞吉。","plain":"九五：備好酒食安然等待，守持正道吉祥。","insight":"等待中安然自處、保持正道，自然有好結果。"},{"pos":"上六","text":"上六，入于穴，有不速之客三人來，敬之，終吉。","plain":"上六：落入險穴之中，有三位不請自來的客人到來，恭敬地對待他們，最終吉祥。","insight":"陷入困境時，對意外來的人或機會以禮相待，終能轉危為安。"}]},{"n":6,"name":"訟","sym":"䷅","lower":"坎","upper":"乾","lines":[0,1,0,1,1,1],"meaning":"爭訟宜止，慎始息爭","judgment":{"text":"訟，有孚窒，惕中吉，終凶，利見大人，不利涉大川。","plain":"訟卦象徵爭訟。心中有誠信卻受到窒塞，能警惕而適可而止就吉祥，堅持把官司打到底則兇險。利於見公正的大人來裁斷，不利於渡過大河、冒險行事。","insight":"即使有理受屈，也應適可而止；把爭執鬧到底必有損失，宜請公正之人調解。"},"image":{"text":"《象》曰：天與水違行，訟，君子以作事謀始。","plain":"《象傳》說：天向上而水向下，彼此背道而行，這就是訟；君子效法它，做事時在一開始就謀劃周全，以杜絕爭端。"},"yao":[{"pos":"初六","text":"初六，不永所事，小有言，終吉。","plain":"初六：不把爭訟之事拖長，稍受一些言語責難，最終吉祥。","insight":"糾紛剛起時及早收手，雖有小爭論，最終無事。"},{"pos":"九二","text":"九二，不克訟，歸而逋，其邑人三百戶，无眚。","plain":"九二：打不贏官司，回去後逃避躲藏；他的封邑只是三百戶的小邑，就不會招來災禍。","insight":"自知爭不過強者，及時退讓才能保全自己與身邊的人。"},{"pos":"六三","text":"六三，食舊德，貞，厲終吉。或從王事，无成。","plain":"六三：安享祖先遺留的舊有俸祿，守持正道，雖有危險最終吉祥。如果去輔佐君王做事，不要自居成功。","insight":"安守本分、不爭不搶，雖有壓力終能平安。"},{"pos":"九四","text":"九四，不克訟，復即命，渝，安貞，吉。","plain":"九四：打不贏官司，回頭接受正理，改變爭訟的心意，安於正道，吉祥。","insight":"爭不贏時回頭反省、改變心態，反而得吉。"},{"pos":"九五","text":"九五，訟，元吉。","plain":"九五：主持訴訟、公正裁斷，大為吉祥。","insight":"公正的仲裁者能讓爭端平息，是大吉之象。"},{"pos":"上九","text":"上九，或錫之鞶帶，終朝三褫之。","plain":"上九：或許因爭訟得勝而被賞賜官服大帶，但一個早上就被剝奪了三次。","insight":"靠爭鬥得來的利益，來得快也去得快，不值得驕傲。"}]},{"n":7,"name":"師","sym":"䷆","lower":"坎","upper":"坤","lines":[0,1,0,0,0,0],"meaning":"統眾用兵，貴在正與將","judgment":{"text":"師，貞，丈人吉，无咎。","plain":"師卦象徵軍隊與用兵。出兵必須守正，由老成持重的長者來統帥才吉祥，沒有過失。","insight":"帶領團隊行動，目標必須正當，並由穩重有經驗的人領導。"},"image":{"text":"《象》曰：地中有水，師，君子以容民畜眾。","plain":"《象傳》說：地中蘊藏著水，這就是師；君子效法它，包容百姓、蓄養民眾。"},"yao":[{"pos":"初六","text":"初六，師出以律，否臧凶。","plain":"初六：軍隊出征必須有紀律，紀律不好就兇險。","insight":"團隊一開始就要建立紀律，紀律鬆散必然失敗。"},{"pos":"九二","text":"九二，在師中，吉，无咎，王三錫命。","plain":"九二：身在軍中而居中道，吉祥，沒有過失，君王多次頒布命令嘉獎他。","insight":"領導者身處團隊之中、得上級信任，是成功的關鍵。"},{"pos":"六三","text":"六三，師或輿尸，凶。","plain":"六三：軍隊可能載著屍體敗回，兇險。","insight":"用人不當、多頭指揮，會導致慘敗。"},{"pos":"六四","text":"六四，師左次，无咎。","plain":"六四：軍隊退後駐紮，沒有過失。","insight":"形勢不利時暫退保存實力，並非失策。"},{"pos":"六五","text":"六五，田有禽，利執言，无咎，長子帥師，弟子輿尸，貞凶。","plain":"六五：田裡有野獸侵害禾苗，利於捕捉它，師出有名，沒有過失。應由長子統帥軍隊；若讓次子小人參與，就會載屍而回，即使守正也兇險。","insight":"出師要有正當理由，並委任賢能；用錯人即使理直也會失敗。"},{"pos":"上六","text":"上六，大君有命，開國承家，小人勿用。","plain":"上六：天子頒布命令論功行賞，封賞諸侯開國、大夫承家；小人不可任用。","insight":"論功行賞要公正，小人不可委以重任。"}]},{"n":8,"name":"比","sym":"䷇","lower":"坤","upper":"坎","lines":[0,0,0,0,1,0],"meaning":"親近依附，擇善而從","judgment":{"text":"比，吉。原筮元永貞，无咎。不寧方來，後夫凶。","plain":"比卦象徵親近依附，吉祥。要再次仔細占問、反省自身，確實具備大德、能長久而守正，才沒有過失。不安寧的人將會前來歸附，遲遲不來的人則有兇險。","insight":"親近他人前先反省自己是否值得信任；猶豫觀望太久，就會錯失良機。"},"image":{"text":"《象》曰：地上有水，比，先王以建萬國，親諸侯。","plain":"《象傳》說：地上有水，水與地親密無間，這就是比；古代君王效法它，分封建立萬國，親近各方諸侯。"},"yao":[{"pos":"初六","text":"初六，有孚比之，无咎。有孚盈缶，終來有他吉。","plain":"初六：以誠信親附於人，沒有過失。誠信充滿，像盛滿了瓦缸一樣，最終還會有意外的吉祥到來。","insight":"以真誠待人為開端，會帶來意想不到的好處。"},{"pos":"六二","text":"六二，比之自內，貞吉。","plain":"六二：從內心出發去親附在上的君主，守正吉祥。","insight":"發自內心地親近正確的人，不失自我。"},{"pos":"六三","text":"六三，比之匪人。","plain":"六三：所親附的都不是正當的人。","insight":"結交不正當的朋友，終會受傷。"},{"pos":"六四","text":"六四，外比之，貞吉。","plain":"六四：向外親附賢明的君主，守正吉祥。","insight":"向外親近賢能，追隨正道，吉祥。"},{"pos":"九五","text":"九五，顯比，王用三驅，失前禽，邑人不誡，吉。","plain":"九五：光明正大地讓人親附。君王狩獵時三面驅趕、網開一面，任由前面逃走的禽獸離去；城裡的百姓也不必警戒，吉祥。","insight":"領導者光明磊落，來者不拒、去者不追，人心自然歸附。"},{"pos":"上六","text":"上六，比之无首，凶。","plain":"上六：親附他人卻沒有好的開頭，兇險。","insight":"錯過結盟的時機、沒有好的開端，就難有好結果。"}]},{"n":9,"name":"小畜","sym":"䷈","lower":"乾","upper":"巽","lines":[1,1,1,0,1,1],"meaning":"小有積蓄，蓄勢未發","judgment":{"text":"小畜。亨。密雲不雨，自我西郊。","plain":"小畜卦象徵以小蓄大、稍有積聚，可以亨通。烏雲密布卻還沒下雨，雲從我西邊的郊外而來。","insight":"力量尚小時只能稍作積累，條件還不成熟，像雲密卻未下雨。"},"image":{"text":"《象》曰：風行天上，小畜，君子以懿文德。","plain":"《象傳》說：風在天上吹行，這就是小畜；君子效法它，修養美好的文采與德行。"},"yao":[{"pos":"初九","text":"初九，復自道，何其咎，吉。","plain":"初九：返回到自己的正道，會有什麼過失呢？吉祥。","insight":"發現偏離方向就及時回到正軌，自然無咎。"},{"pos":"九二","text":"九二，牽復，吉。","plain":"九二：被牽連著一同返回正道，吉祥。","insight":"在同伴的牽引下一起回歸正道，也是好事。"},{"pos":"九三","text":"九三，輿說輻，夫妻反目。","plain":"九三：車子脫落了輪輻，無法前行；夫妻反目不和。","insight":"力量受制時強行前進，會造成關係破裂。"},{"pos":"六四","text":"六四，有孚，血去惕出，无咎。","plain":"六四：心存誠信，就能免除流血的傷害、脫離憂懼，沒有過失。","insight":"以誠信化解疑懼，能避開傷害。"},{"pos":"九五","text":"九五，有孚攣如，富以其鄰。","plain":"九五：心存誠信，與他人緊密相連，能與鄰人共享富足。","insight":"與人同心同德、分享成果，大家都能富足。"},{"pos":"上九","text":"上九，既雨既處，尚德載，婦貞厲，月幾望，君子征凶。","plain":"上九：雨已經下了，陰陽已經安定，是因為尊尚德行的積累已滿。但婦人若一直如此強盛，即使守正也有危險；像月亮快要圓滿時那樣，君子若再有所行動就兇險。","insight":"積累已滿就該停止，過度追求會招致危險。"}]},{"n":10,"name":"履","sym":"䷉","lower":"兌","upper":"乾","lines":[1,1,0,1,1,1],"meaning":"如履虎尾，謹慎守禮","judgment":{"text":"履虎尾，不咥人，亨。","plain":"履卦象徵小心踐行。踩在老虎尾巴後面，老虎卻不咬人，亨通。","insight":"與強者共事時，以和悅謙恭的態度應對，即使身處險境也能平安。"},"image":{"text":"《象》曰：上天下澤，履，君子以辯上下，定民志。","plain":"《象傳》說：上為天、下為澤，尊卑分明，這就是履；君子效法它，辨明上下名分，安定民心志向。"},"yao":[{"pos":"初九","text":"初九，素履，往无咎。","plain":"初九：以樸素本分的態度踐行，前往沒有過失。","insight":"保持本色、踏實做事，前進無咎。"},{"pos":"九二","text":"九二，履道坦坦，幽人貞吉。","plain":"九二：所走的道路平坦寬廣，幽靜恬淡的人守正吉祥。","insight":"心境平和、不隨波逐流，正道自然坦蕩。"},{"pos":"六三","text":"六三，眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。","plain":"六三：瞎了一隻眼還自以為能看，跛了腳還自以為能走，結果踩到虎尾而被咬，兇險。這就像一個勇武之人妄想作為大君。","insight":"能力不足卻自以為是，最容易招來禍患。"},{"pos":"九四","text":"九四，履虎尾，愬愬，終吉。","plain":"九四：踩在虎尾之後，戒慎恐懼，最終吉祥。","insight":"身處險境而戒慎恐懼，最終吉祥。"},{"pos":"九五","text":"九五，夬履，貞厲。","plain":"九五：果決地行事，即使守正也有危險。","insight":"位高權重者行事過於果決，要警惕其中的危險。"},{"pos":"上九","text":"上九，視履考祥，其旋元吉。","plain":"上九：回顧自己走過的路，考察其中的善惡吉凶；若周全圓滿、始終如一，就大吉。","insight":"回顧走過的路，檢討得失；始終如一就大吉。"}]},{"n":11,"name":"泰","sym":"䷊","lower":"乾","upper":"坤","lines":[1,1,1,0,0,0],"meaning":"上下交通，安泰和順","judgment":{"text":"泰，小往大來，吉亨。","plain":"泰卦象徵通泰安和。陰小的離去，陽大的到來，吉祥亨通。","insight":"上下溝通順暢、同心協力，小人退而君子進，局面亨通。"},"image":{"text":"《象》曰：天地交，泰，后以財成天地之道，輔相天地之宜，以左右民。","plain":"《象傳》說：天地交感，這就是泰；君王效法它，裁度成就天地的法則，輔助天地使萬物得宜，以此扶助百姓。"},"yao":[{"pos":"初九","text":"初九，拔茅茹以其彙，征吉。","plain":"初九：拔起茅草，根系相連，一起被拔出，同類一齊前進，吉祥。","insight":"志同道合的人相互提攜，一同前進。"},{"pos":"九二","text":"九二，包荒，用馮河，不遐遺，朋亡，得尚于中行。","plain":"九二：有包容荒穢的胸襟，有徒步渡河的果斷，不遺棄遠方的人，也不結黨營私，就能合於中正之道。","insight":"有包容的胸襟、果斷的魄力、不結黨營私，才能守住盛世。"},{"pos":"九三","text":"九三，无平不陂，无往不復，艱貞无咎，勿恤其孚，于食有福。","plain":"九三：沒有只平不陂的地，沒有只去不回的事。在艱難中守正就沒有過失；不必憂慮能否取信，自然在衣食上會有福分。","insight":"沒有永遠的平順，順境中更要守正、居安思危。"},{"pos":"六四","text":"六四，翩翩，不富以其鄰，不戒以孚。","plain":"六四：輕快地飛下來，不靠財富也能與鄰居同來，不需告誡就彼此信任。","insight":"上位者放下身段與下屬真誠交流，無需告誡自然互信。"},{"pos":"六五","text":"六五，帝乙歸妹，以祉元吉。","plain":"六五：帝乙把妹妹嫁出去，因此得到福祉，大為吉祥。","insight":"以謙和的姿態成全他人，能得到大福。"},{"pos":"上六","text":"上六，城復于隍。勿用師，自邑告命，貞吝。","plain":"上六：城牆倒塌回到護城的乾溝裡。不可用兵，只能在自己的城邑中發布命令；即使守正也有憾惜。","insight":"盛極轉衰時不宜硬拚，只能守住自身、檢討改正。"}]},{"n":12,"name":"否","sym":"䷋","lower":"坤","upper":"乾","lines":[0,0,0,1,1,1],"meaning":"閉塞不通，君子守節","judgment":{"text":"否之匪人，不利君子貞，大往小來。","plain":"否卦象徵閉塞不通，這不是人道正常的狀態；不利於君子守正，陽大的離去，陰小的到來。","insight":"上下隔絕、小人當道時，君子不利於作為，應收斂鋒芒。"},"image":{"text":"《象》曰：天地不交，否，君子以儉德辟難，不可榮以祿。","plain":"《象傳》說：天地不交感，這就是否；君子效法它，收斂德行以避開災難，不可追求榮華與俸祿。"},"yao":[{"pos":"初六","text":"初六，拔茅茹以其彙，貞吉亨。","plain":"初六：拔起茅草，根系相連，同類一起；此時守正就吉祥亨通。","insight":"困境中與同道相守、堅持正道，仍可亨通。"},{"pos":"六二","text":"六二，包承，小人吉，大人否，亨。","plain":"六二：包容承順上位者，對小人來說是吉祥的；大人則應安於閉塞，才能使正道亨通。","insight":"小人靠逢迎得利；君子寧可安於困頓也不同流合污。"},{"pos":"六三","text":"六三，包羞。","plain":"六三：包藏著羞恥。","insight":"為了利益忍辱逢迎，內心其實充滿羞愧。"},{"pos":"九四","text":"九四，有命，无咎，疇離祉。","plain":"九四：奉天命而行，沒有過失，同類都依附而得到福祉。","insight":"順應時運、承擔使命，同伴也能一同受益。"},{"pos":"九五","text":"九五，休否，大人吉。其亡其亡，繫于苞桑。","plain":"九五：使閉塞停止，大人吉祥。要時刻警惕「快要滅亡了、快要滅亡了」，才能像繫在叢生的桑樹根上一樣穩固。","insight":"扭轉困局時要時時危機意識，才能根基穩固。"},{"pos":"上九","text":"上九，傾否。先否後喜。","plain":"上九：閉塞被傾覆了。先是閉塞，後來就有喜悅。","insight":"閉塞到極點終會被打破，先苦後甘。"}]},{"n":13,"name":"同人","sym":"䷌","lower":"離","upper":"乾","lines":[1,0,1,1,1,1],"meaning":"與人和同，大公無私","judgment":{"text":"同人于野，亨。利涉大川，利君子貞。","plain":"同人卦象徵與人和同。在廣闊的郊野與人和同，大公無私，亨通。利於渡過大河，利於君子守持正道。","insight":"以開闊無私的心與人合作，能克服大困難，但必須以正道為基礎。"},"image":{"text":"《象》曰：天與火，同人，君子以類族辨物。","plain":"《象傳》說：天與火性質相同而上行，這就是同人；君子效法它，依類別聚合族群、辨別事物，以求同中有別。"},"yao":[{"pos":"初九","text":"初九，同人于門，无咎。","plain":"初九：一出門就與人和同，沒有過失。","insight":"一出門就廣交朋友，不存私心，沒有過失。"},{"pos":"六二","text":"六二，同人于宗，吝。","plain":"六二：只與自己的宗族和同，有憾惜。","insight":"只和自己的小圈子交好，格局太小。"},{"pos":"九三","text":"九三，伏戎于莽，升其高陵，三歲不興。","plain":"九三：把兵埋伏在草莽之中，登上高丘窺望，三年都不敢發動。","insight":"心懷敵意、暗中算計，終究不敢行動，徒勞無功。"},{"pos":"九四","text":"九四，乘其墉，弗克攻，吉。","plain":"九四：登上了對方的城牆，卻自知不義而不再進攻，吉祥。","insight":"明白不該爭奪而及時收手，反而吉祥。"},{"pos":"九五","text":"九五，同人先號咷而後笑，大師克相遇。","plain":"九五：與人和同，先是號啕大哭，後來歡笑；大軍作戰得勝，才終於相遇。","insight":"真心相合的人，即使先經波折，終會團聚。"},{"pos":"上九","text":"上九，同人于郊，无悔。","plain":"上九：在遙遠的郊外與人和同，沒有懊悔。","insight":"雖未完全實現理想，但保持和同之心，沒有懊悔。"}]},{"n":14,"name":"大有","sym":"䷍","lower":"乾","upper":"離","lines":[1,1,1,1,0,1],"meaning":"富有盛大，揚善守謙","judgment":{"text":"大有，元亨。","plain":"大有卦象徵大有所得、豐盛富有，大為亨通。","insight":"擁有豐盛資源時，更要以德行相配，才能大為亨通。"},"image":{"text":"《象》曰：火在天上，大有，君子以遏惡揚善，順天休命。","plain":"《象傳》說：火在天上，光照萬物，這就是大有；君子效法它，遏止邪惡、宣揚善良，順從上天美好的命令。"},"yao":[{"pos":"初九","text":"初九，无交害，匪咎，艱則无咎。","plain":"初九：不與有害的事物交往，就不會有過失；能時時想著艱難，便沒有過失。","insight":"富有之初，遠離有害的交往，時時想著艱難，就不會出錯。"},{"pos":"九二","text":"九二，大車以載，有攸往，无咎。","plain":"九二：用大車裝載財物，有所前往，沒有過失。","insight":"有才幹、能擔當，可以承擔重任。"},{"pos":"九三","text":"九三，公用亨于天子，小人弗克。","plain":"九三：公侯向天子獻禮朝享，小人則無法做到。","insight":"有地位的人應把所有貢獻給大局；小人得之反而招禍。"},{"pos":"九四","text":"九四，匪其彭，无咎。","plain":"九四：不自恃盛大，就沒有過失。","insight":"富而不驕、不炫耀，就沒有過失。"},{"pos":"六五","text":"六五，厥孚交如，威如，吉。","plain":"六五：以誠信與人交往，又有威嚴，吉祥。","insight":"以誠待人又有威嚴，才能服眾。"},{"pos":"上九","text":"上九，自天佑之，吉，无不利。","plain":"上九：從上天得到保佑，吉祥，沒有不利的。","insight":"順天行事、謙以自持，自然得到上天保佑。"}]},{"n":15,"name":"謙","sym":"䷎","lower":"艮","upper":"坤","lines":[0,0,1,0,0,0],"meaning":"謙虛受益，君子有終","judgment":{"text":"謙，亨，君子有終。","plain":"謙卦象徵謙虛，亨通；君子能夠有好的結果。","insight":"謙虛是使一切亨通的美德，能讓君子善始善終。"},"image":{"text":"《象》曰：地中有山，謙，君子以裒多益寡。稱物平施。","plain":"《象傳》說：地中藏著高山，這就是謙；君子效法它，減損多的、增益少的，衡量事物而公平施予。"},"yao":[{"pos":"初六","text":"初六，謙謙君子，用涉大川，吉。","plain":"初六：謙而又謙的君子，可以藉此渡過大河，吉祥。","insight":"謙之又謙，以低姿態行事，可以克服困難。"},{"pos":"六二","text":"六二，鳴謙，貞吉。","plain":"六二：謙虛的美名遠揚，守正吉祥。","insight":"謙虛發自內心而有名聲，守正吉祥。"},{"pos":"九三","text":"九三，勞謙君子，有終吉。","plain":"九三：有功勞而謙虛的君子，能有好的結果，吉祥。","insight":"有功勞而不自誇，最能讓人心服。"},{"pos":"六四","text":"六四，无不利，撝謙。","plain":"六四：沒有不利的，要發揚謙虛之德。","insight":"在任何位置都發揮謙德，無往不利。"},{"pos":"六五","text":"六五，不富以其鄰。利用侵伐，无不利。","plain":"六五：不靠財富也能使鄰人追隨。利於出兵征伐，沒有不利的。","insight":"謙虛不等於軟弱，對不服者也要敢於糾正。"},{"pos":"上六","text":"上六，鳴謙，利用行師，征邑國。","plain":"上六：謙虛的名聲遠揚，利於出動軍隊，征討自己的城邑和封國。","insight":"謙名在外而志未伸，應先整頓自身。"}]},{"n":16,"name":"豫","sym":"䷏","lower":"坤","upper":"震","lines":[0,0,0,1,0,0],"meaning":"和樂順動，居安思危","judgment":{"text":"豫，利建侯行師。","plain":"豫卦象徵和樂安逸，利於建立諸侯、出兵作戰。","insight":"順應人心而行動，大家都樂於跟從，適合推動大事。"},"image":{"text":"《象》曰：雷出地奮，豫，先王以作樂崇德，殷薦之上帝，以配祖考。","plain":"《象傳》說：雷從地中奮發而出，這就是豫；古代君王效法它，創製音樂、崇尚德行，隆重地獻祭給上帝，並以祖先配享。"},"yao":[{"pos":"初六","text":"初六，鳴豫，凶。","plain":"初六：得意地自鳴歡樂，兇險。","insight":"得意忘形、炫耀享樂，必有凶險。"},{"pos":"六二","text":"六二，介于石，不終日，貞吉。","plain":"六二：堅定如石，見到事情的徵兆，不必等到一天結束就立刻離開，守正吉祥。","insight":"意志堅定如石，見到不好的苗頭立刻抽身。"},{"pos":"六三","text":"六三，盱豫悔，遲有悔。","plain":"六三：仰望上位者以求歡樂，必有懊悔；遲疑不改，也會有懊悔。","insight":"仰人鼻息地求取享樂，猶豫不改必有悔。"},{"pos":"九四","text":"九四，由豫，大有得。勿疑，朋盍簪。","plain":"九四：眾人因他而得到歡樂，大有收穫。不要猶疑，朋友都會像髮簪聚攏頭髮一樣聚集過來。","insight":"成為眾人快樂的來源，以誠相待，朋友自然聚集。"},{"pos":"六五","text":"六五，貞疾，恒不死。","plain":"六五：雖然守正卻一直有病，但長期不會死。","insight":"處境不安但居中守正，雖有隱憂仍能長久。"},{"pos":"上六","text":"上六，冥豫。成有渝，无咎。","plain":"上六：沉溺於歡樂到了昏昧的地步。如果已經形成而能夠改變，就沒有過失。","insight":"沉溺享樂到昏昧，若能及早改變仍可無咎。"}]},{"n":17,"name":"隨","sym":"䷐","lower":"震","upper":"兌","lines":[1,0,0,1,1,0],"meaning":"隨順時勢，擇正而從","judgment":{"text":"隨，元亨，利貞，无咎。","plain":"隨卦象徵隨從，大為亨通，但利於守持正道，才沒有過失。","insight":"隨從他人或時勢可以亨通，但所隨必須正當，才不會出錯。"},"image":{"text":"《象》曰：澤中有雷，隨，君子以嚮晦入宴息。","plain":"《象傳》說：澤中有雷，雷藏於澤中而休息，這就是隨；君子效法它，到了天黑就入室休息。"},"yao":[{"pos":"初九","text":"初九，官有渝，貞吉。出門交有功。","plain":"初九：所主持的事有所改變，守正就吉祥。出門與人交往，會有功績。","insight":"環境改變時，堅守正道並走出去廣結善緣。"},{"pos":"六二","text":"六二，係小子，失丈夫。","plain":"六二：依附於年幼的小子，就失去了成年的丈夫。","insight":"貪戀眼前小利或小人，會失去真正值得依靠的人。"},{"pos":"六三","text":"六三，係丈夫，失小子，隨有求得，利居貞。","plain":"六三：依附於成年的丈夫，失去了年幼的小子；隨從他人而有求必得，但利於安居守正。","insight":"追隨賢者而捨棄小人，能有所得，但要守住本分。"},{"pos":"九四","text":"九四，隨有獲，貞凶，有孚在道，以明，何咎？","plain":"九四：讓人隨從自己而有所收穫，即使守正也兇險。若能心存誠信、合於正道，並以明智處事，又會有什麼過失呢？","insight":"他人追隨自己而功高震主，必須以誠信與明智化解。"},{"pos":"九五","text":"九五，孚于嘉，吉。","plain":"九五：以誠信對待美善之人，吉祥。","insight":"真心信任美善之人，吉祥。"},{"pos":"上六","text":"上六，拘係之，乃從維之。王用亨于西山。","plain":"上六：牢牢地把它拘禁繫住，又用繩索綁緊。君王因此在西山舉行祭享。","insight":"以誠意牢牢維繫人心，連神明都能感動。"}]},{"n":18,"name":"蠱","sym":"䷑","lower":"巽","upper":"艮","lines":[0,1,1,0,0,1],"meaning":"整治積弊，革故鼎新","judgment":{"text":"蠱，元亨，利涉大川。先甲三日，後甲三日。","plain":"蠱卦象徵敗壞而需要整治。整治得當可以大為亨通，利於渡過大河。要在甲日之前三天、甲日之後三天，前後周密地謀劃。","insight":"面對前人留下的弊病，要勇於整頓；事前周密謀劃、事後仔細檢討。"},"image":{"text":"《象》曰：山下有風，蠱。君子以振民育德。","plain":"《象傳》說：山下有風吹動，這就是蠱；君子效法它，振奮民心、培育德行。"},"yao":[{"pos":"初六","text":"初六，幹父之蠱，有子，考无咎，厲終吉。","plain":"初六：整治父親留下的弊壞，有這樣的兒子，父親就不會有過失；雖然有危險，最終吉祥。","insight":"繼承者勇於修正前人的錯誤，雖有風險終能成功。"},{"pos":"九二","text":"九二，幹母之蠱，不可貞。","plain":"九二：整治母親留下的弊壞，不可過於剛直固執。","insight":"處理溫和者的過失，要講究方法，不可過剛。"},{"pos":"九三","text":"九三，幹父之蠱，小有悔，无大咎。","plain":"九三：整治父親留下的弊壞，稍有懊悔，但沒有大的過失。","insight":"大刀闊斧改革難免小有後悔，但無大過。"},{"pos":"六四","text":"六四，裕父之蠱，往見吝。","plain":"六四：寬緩地對待父親留下的弊壞，繼續下去就會遭遇憾惜。","insight":"對積弊姑息寬容，只會越來越糟。"},{"pos":"六五","text":"六五，幹父之蠱，用譽。","plain":"六五：整治父親留下的弊壞，因而得到讚譽。","insight":"以德行與智慧整頓問題，能贏得讚譽。"},{"pos":"上九","text":"上九，不事王侯，高尚其事。","plain":"上九：不侍奉王侯，把自己的志行看得高尚。","insight":"不戀權位、潔身自好，也是一種高尚的選擇。"}]},{"n":19,"name":"臨","sym":"䷒","lower":"兌","upper":"坤","lines":[1,1,0,0,0,0],"meaning":"居上臨下，以德感人","judgment":{"text":"臨，元亨，利貞。至于八月有凶。","plain":"臨卦象徵陽氣逼近、居上臨下。大為亨通，利於守持正道。但到了八月就會有兇險。","insight":"勢力正在增長時大可作為，但要預防盛極轉衰的那一天。"},"image":{"text":"《象》曰：澤上有地，臨，君子以教思无窮，容保民无疆。","plain":"《象傳》說：澤上有地，地居高臨下，這就是臨；君子效法它，教化百姓的心思無窮無盡，包容保護百姓沒有邊際。"},"yao":[{"pos":"初九","text":"初九，咸臨，貞吉。","plain":"初九：以感化之心臨人，守正吉祥。","insight":"以真誠感化他人，堅守正道就吉祥。"},{"pos":"九二","text":"九二，咸臨，吉，无不利。","plain":"九二：以感化之心臨人，吉祥，沒有不利的。","insight":"以感化代替命令，處處順利。"},{"pos":"六三","text":"六三，甘臨，无攸利，既憂之，无咎。","plain":"六三：用甜言蜜語去臨人，沒有什麼好處；如果已經憂慮而知道改正，就沒有過失。","insight":"用甜言蜜語討好管理，沒有好處；及早改正可免過失。"},{"pos":"六四","text":"六四，至臨，无咎。","plain":"六四：親身臨近下民，沒有過失。","insight":"親身深入基層，與人親近，沒有過失。"},{"pos":"六五","text":"六五，知臨，大君之宜，吉。","plain":"六五：以智慧臨人，這是偉大君主所應做的，吉祥。","insight":"領導者知人善任、運用智慧，最為適宜。"},{"pos":"上六","text":"上六，敦臨，吉，无咎。","plain":"上六：以敦厚之心臨人，吉祥，沒有過失。","insight":"以敦厚之心對待下屬，吉祥無咎。"}]},{"n":20,"name":"觀","sym":"䷓","lower":"坤","upper":"巽","lines":[0,0,0,0,1,1],"meaning":"觀察省思，以身作則","judgment":{"text":"觀，盥而不薦，有孚顒若。","plain":"觀卦象徵展示與觀仰。祭祀時洗手準備而尚未獻上祭品，那份誠敬莊嚴的樣子，令人仰望。","insight":"領導者以誠敬莊重的態度示範，比空談更能感化人。"},"image":{"text":"《象》曰：風行地上，觀，先王以省方觀民設教。","plain":"《象傳》說：風在地上吹行，無所不至，這就是觀；古代君王效法它，巡視四方，觀察民情，設立教化。"},"yao":[{"pos":"初六","text":"初六，童觀，小人无咎，君子吝。","plain":"初六：像孩童一樣淺陋地觀看，對小人來說沒有過失，對君子來說則有憾惜。","insight":"見識淺陋對普通人無妨，對有志者則是遺憾。"},{"pos":"六二","text":"六二，窺觀，利女貞。","plain":"六二：從門縫裡偷看，只適合女子守正。","insight":"只從門縫偷看，視野狹窄，不夠大器。"},{"pos":"六三","text":"六三，觀我生，進退。","plain":"六三：觀察自己的所作所為，以決定進退。","insight":"觀察自己的言行表現，再決定進退。"},{"pos":"六四","text":"六四，觀國之光，利用賓于王。","plain":"六四：觀仰國家的光輝盛況，利於成為君王的賓客、出仕輔佐。","insight":"多觀察優秀組織的風範，有利於尋找發展機會。"},{"pos":"九五","text":"九五，觀我生，君子无咎。","plain":"九五：觀察自己的所作所為，若合於君子之道，就沒有過失。","insight":"領導者要從百姓的狀況來檢視自己的作為。"},{"pos":"上九","text":"上九，觀其生，君子无咎。","plain":"上九：觀察自己的所作所為，若合於君子之道，就沒有過失。","insight":"即使已在高位，仍應不斷反省自身。"}]},{"n":21,"name":"噬嗑","sym":"䷔","lower":"震","upper":"離","lines":[1,0,0,1,0,1],"meaning":"咬合除障，明罰整法","judgment":{"text":"噬嗑，亨，利用獄。","plain":"噬嗑卦象徵咬合，除去阻隔就能亨通，利於施用刑獄。","insight":"有阻礙就要果斷清除，對違規者依法處置，才能恢復通暢。"},"image":{"text":"《象》曰：雷電，噬嗑；先王以明罰勑法。","plain":"《象傳》說：雷電交作，這就是噬嗑；古代君王效法它，嚴明刑罰、整飭法令。"},"yao":[{"pos":"初九","text":"初九，屨校滅趾，无咎。","plain":"初九：腳上戴著刑具，遮沒了腳趾，受小懲而能大誡，沒有過失。","insight":"小錯即懲，使人及早警惕，反而避免大禍。"},{"pos":"六二","text":"六二，噬膚滅鼻，无咎。","plain":"六二：咬柔軟的肉，深得連鼻子都埋沒了，沒有過失。","insight":"處理頑強對象時下手重一些，並無過失。"},{"pos":"六三","text":"六三，噬腊肉，遇毒，小吝，无咎。","plain":"六三：咬又乾又硬的臘肉，碰到了腐敗有毒的部分，稍有憾惜，但沒有過失。","insight":"處理陳年積案會遇到麻煩，稍有不順但無大過。"},{"pos":"九四","text":"九四，噬乾胏，得金矢，利艱貞，吉。","plain":"九四：咬帶骨的乾肉，得到了金屬的箭頭；利於在艱難中守持正道，吉祥。","insight":"處理棘手問題要像咬骨頭般堅持，艱難中守正則吉。"},{"pos":"六五","text":"六五，噬乾肉，得黃金，貞厲，无咎。","plain":"六五：咬乾肉，得到黃金；守正並保持警惕，沒有過失。","insight":"處理問題時保持中正並時時警惕，就沒有過失。"},{"pos":"上九","text":"上九，何校滅耳，凶。","plain":"上九：肩上扛著刑具，遮沒了耳朵，兇險。","insight":"屢勸不聽、罪惡累積，最終招致重罰。"}]},{"n":22,"name":"賁","sym":"䷕","lower":"離","upper":"艮","lines":[1,0,1,0,0,1],"meaning":"文飾修美，質重於文","judgment":{"text":"賁，亨，小利有攸往。","plain":"賁卦象徵文飾與修飾，亨通；小事利於有所前往。","insight":"適度的包裝修飾能增添光彩，但只能成就小事，本質才是根本。"},"image":{"text":"《象》曰：山下有火，賁，君子以明庶政，无敢折獄。","plain":"《象傳》說：山下有火，照亮山上草木，這就是賁；君子效法它，明察各項政務，但不敢憑文飾來斷決訴訟。"},"yao":[{"pos":"初九","text":"初九，賁其趾，舍車而徒。","plain":"初九：修飾自己的腳趾，捨棄車子而徒步行走。","insight":"寧可樸素步行，也不貪圖不合道義的享受。"},{"pos":"六二","text":"六二，賁其須。","plain":"六二：修飾自己的鬍鬚。","insight":"文飾依附於本質，隨主體而動。"},{"pos":"九三","text":"九三，賁如濡如，永貞吉。","plain":"九三：修飾得光彩潤澤，永遠守持正道就吉祥。","insight":"光鮮亮麗時更要長久守正，才不會被人輕侮。"},{"pos":"六四","text":"六四，賁如皤如，白馬翰如，匪寇婚媾。","plain":"六四：修飾得素白無華，騎著白馬飛奔而來；來的不是強盜，而是求婚的人。","insight":"在華麗與素樸之間猶豫，最終選擇真誠的關係。"},{"pos":"六五","text":"六五，賁于丘園，束帛戔戔，吝，終吉。","plain":"六五：修飾山丘上的園圃，只送上少量的束帛，雖然顯得吝嗇寒酸，最終吉祥。","insight":"禮物雖薄而心意真誠，起初看似寒酸，最終吉祥。"},{"pos":"上九","text":"上九，白賁，无咎。","plain":"上九：以素白為修飾，返璞歸真，沒有過失。","insight":"繁華落盡，返璞歸真，是最高境界的美。"}]},{"n":23,"name":"剝","sym":"䷖","lower":"坤","upper":"艮","lines":[0,0,0,0,0,1],"meaning":"剝落衰敗，順時而止","judgment":{"text":"剝，不利有攸往。","plain":"剝卦象徵剝落衰敗，不利於有所前往。","insight":"小人得勢、局面衰敗時，不宜輕舉妄動，應順勢暫停、保存實力。"},"image":{"text":"《象》曰：山附於地，剝，上以厚下安宅。","plain":"《象傳》說：高山依附在地上，這就是剝；在上位的人效法它，厚待下民，使居處安穩。"},"yao":[{"pos":"初六","text":"初六，剝床以足，蔑貞凶。","plain":"初六：剝落床腳，毀滅正道，兇險。","insight":"根基開始被侵蝕，若不警覺，正道將被摧毀。"},{"pos":"六二","text":"六二，剝床以辨，蔑貞凶。","plain":"六二：剝落到床幹，毀滅正道，兇險。","insight":"侵蝕漸深而無人援助，處境越發危險。"},{"pos":"六三","text":"六三，剝之，无咎。","plain":"六三：在剝落之中，卻能與群陰脫離，沒有過失。","insight":"身處小人群中而心向君子，能免於過失。"},{"pos":"六四","text":"六四，剝床以膚，凶。","plain":"六四：剝落到床上，傷及人的肌膚，兇險。","insight":"禍害已切身，十分凶險。"},{"pos":"六五","text":"六五，貫魚以宮人寵，无不利。","plain":"六五：像把魚串成一串那樣率領群陰，讓宮中的嬪妃依次受寵，沒有不利的。","insight":"能有序地統率眾人、親近君子，終無不利。"},{"pos":"上九","text":"上九，碩果不食，君子得輿，小人剝廬。","plain":"上九：碩大的果實沒有被吃掉；君子得到它，會被百姓擁戴如乘大車；小人得到它，就連自己的房屋都會剝落毀壞。","insight":"碩果僅存，君子得之可以重新振興；小人則自毀根基。"}]},{"n":24,"name":"復","sym":"䷗","lower":"震","upper":"坤","lines":[1,0,0,0,0,0],"meaning":"一陽來復，迷途知返","judgment":{"text":"復，亨。出入无疾，朋來无咎。反復其道，七日來復。利有攸往。","plain":"復卦象徵陽氣回復，亨通。出入都沒有阻礙，朋友前來也沒有過失。在正道上往返循環，經過七天就會回復。利於有所前往。","insight":"低谷之後必有轉機，循序漸進地恢復元氣，前景可期。"},"image":{"text":"《象》曰：雷在地中，復，先王以至日閉關，商旅不行，后不省方。","plain":"《象傳》說：雷在地中，陽氣初生，這就是復；古代君王效法它，在冬至這一天關閉關口，商人旅客不出行，君王也不巡視四方，以安養微弱的陽氣。"},"yao":[{"pos":"初九","text":"初九，不遠復，无祇悔，元吉。","plain":"初九：走得不遠就回頭，不至於懊悔，大為吉祥。","insight":"犯錯不遠就回頭，是最好的修身之道。"},{"pos":"六二","text":"六二，休復，吉。","plain":"六二：美好地回復正道，吉祥。","insight":"以美好的心態回歸正道，親近仁者，吉祥。"},{"pos":"六三","text":"六三，頻復，厲无咎。","plain":"六三：屢次迷失又屢次回復，雖有危險但沒有過失。","insight":"屢錯屢改雖不理想，但仍比不改好。"},{"pos":"六四","text":"六四，中行獨復。","plain":"六四：在群陰之中行走，獨自回復正道。","insight":"在眾人迷失時獨自回歸正道，難能可貴。"},{"pos":"六五","text":"六五，敦復，无悔。","plain":"六五：以敦厚之心回復正道，沒有懊悔。","insight":"以敦厚之心反省改過，沒有後悔。"},{"pos":"上六","text":"上六，迷復，凶，有災眚，用行師，終有大敗，以其國君凶，至于十年不克征。","plain":"上六：迷失而不知回復，兇險，會有災禍。若用來出兵打仗，最終會大敗，連帶國君也遭兇險，甚至十年都無法再出征。","insight":"執迷不悟、一錯到底，必然大敗，長久難以翻身。"}]},{"n":25,"name":"无妄","sym":"䷘","lower":"震","upper":"乾","lines":[1,0,0,1,1,1],"meaning":"真實無妄，順其自然","judgment":{"text":"无妄，元亨，利貞。其匪正有眚，不利有攸往。","plain":"无妄卦象徵真實不虛妄。大為亨通，利於守持正道。如果不正，就會有災禍，不利於有所前往。","insight":"心存真誠、不妄作妄為就能亨通；動機不正則招災。"},"image":{"text":"《象》曰：天下雷行，物與无妄，先王以茂對時育萬物。","plain":"《象傳》說：天下有雷運行，萬物都隨之真實無妄；古代君王效法它，盛大地配合天時，養育萬物。"},"yao":[{"pos":"初九","text":"初九，无妄，往吉。","plain":"初九：真實無妄，前往吉祥。","insight":"出於真心行事，前往吉祥。"},{"pos":"六二","text":"六二，不耕穫，不菑畬，則利有攸往。","plain":"六二：不在耕種時就想著收穫，不在開墾時就想著熟田，順其自然而無私心，那就利於有所前往。","insight":"不急功近利、不計較回報，反而有利。"},{"pos":"六三","text":"六三，无妄之災，或繫之牛，行人之得，邑人之災。","plain":"六三：意料之外、無故而來的災禍；比如有人把牛拴在路邊，路過的人順手牽走，城裡的居民反而遭受被懷疑的災禍。","insight":"天有不測風雲，無妄之災雖無辜，也要坦然面對。"},{"pos":"九四","text":"九四，可貞，无咎。","plain":"九四：可以守持正道，沒有過失。","insight":"堅守本分就沒有過失。"},{"pos":"九五","text":"九五，无妄之疾，勿藥有喜。","plain":"九五：無故而來的疾病，不必服藥，自然會好轉而有喜。","insight":"無故的小毛病，不必過度處理，自然會好。"},{"pos":"上九","text":"上九，无妄，行有眚，无攸利。","plain":"上九：雖然無妄，但時機已到盡頭，行動就會有災禍，沒有什麼好處。","insight":"時機不對時，即使動機純正，強行也會招災。"}]},{"n":26,"name":"大畜","sym":"䷙","lower":"乾","upper":"艮","lines":[1,1,1,0,0,1],"meaning":"大有蓄積，厚積薄發","judgment":{"text":"大畜，利貞。不家食，吉，利涉大川。","plain":"大畜卦象徵大有蓄積，利於守持正道。不在家中自食，而是食祿於朝廷，吉祥；利於渡過大河。","insight":"積蓄德行與才能，適合出仕貢獻社會，能克服大難。"},"image":{"text":"《象》曰：天在山中，大畜，君子以多識前言往行，以畜其德。","plain":"《象傳》說：天包藏在山中，這就是大畜；君子效法它，多多記取古聖先賢的言論與行事，以蓄積自己的德行。"},"yao":[{"pos":"初九","text":"初九，有厲，利已。","plain":"初九：前進會有危險，利於停止。","insight":"察覺危險就該停下，不要硬闖。"},{"pos":"九二","text":"九二，輿說輹。","plain":"九二：車子脫落了車軸下的伏兔，停止不前。","insight":"受到限制時主動停車，居中不躁，就沒有過失。"},{"pos":"九三","text":"九三，良馬逐，利艱貞，曰閑輿衛，利有攸往。","plain":"九三：駿馬奔馳追逐，利於在艱難中守正；每天練習駕車和防衛，利於有所前往。","insight":"準備充分、操練有素，可以放手前進。"},{"pos":"六四","text":"六四，童牛之牿，元吉。","plain":"六四：在小牛頭上綁上橫木，防止它長角後牴人，大為吉祥。","insight":"在問題萌芽前就預防，事半功倍。"},{"pos":"六五","text":"六五，豶豕之牙，吉。","plain":"六五：閹割過的豬，牙齒雖在也不再凶猛，吉祥。","insight":"從根本處化解凶猛之勢，比硬碰硬更有效。"},{"pos":"上九","text":"上九，何天之衢，亨。","plain":"上九：何等通暢的天上大道啊，亨通。","insight":"厚積之後，大道通達，可以大展宏圖。"}]},{"n":27,"name":"頤","sym":"䷚","lower":"震","upper":"艮","lines":[1,0,0,0,0,1],"meaning":"頤養之道，養正為吉","judgment":{"text":"頤，貞吉。觀頤，自求口實。","plain":"頤卦象徵頤養。守持正道就吉祥。觀察他人的頤養之道，以及自己如何謀求口中的食物。","insight":"養身與養德都要正當；觀察一個人如何養活自己，可知其品格。"},"image":{"text":"《象》曰：山下有雷，頤，君子以慎言語，節飲食。","plain":"《象傳》說：山下有雷，像人的下顎在動，這就是頤；君子效法它，謹慎言語，節制飲食。"},"yao":[{"pos":"初九","text":"初九，舍爾靈龜，觀我朵頤，凶。","plain":"初九：捨棄你自己如靈龜般不食而能自養的本事，卻看著我嘴裡的食物垂涎欲滴，兇險。","insight":"放棄自己的能力而羨慕他人所得，最為不智。"},{"pos":"六二","text":"六二，顛頤。拂經，于丘頤，征凶。","plain":"六二：顛倒過來向下求養，違背常理；又向上去高丘求養，前往兇險。","insight":"不依循正道、四處乞求供養，前往凶險。"},{"pos":"六三","text":"六三，拂頤，貞凶，十年勿用，无攸利。","plain":"六三：違背頤養的正道，即使守正也兇險；十年都不可施用，沒有什麼好處。","insight":"違背養生正道，長期下去沒有好處。"},{"pos":"六四","text":"六四，顛頤，吉。虎視耽耽，其欲逐逐，无咎。","plain":"六四：顛倒過來向下求養，卻吉祥。像老虎一樣專注地注視，求取的慾望持續不斷，沒有過失。","insight":"為了天下而向下求賢，專注而持續，無咎。"},{"pos":"六五","text":"六五，拂經。居貞吉，不可涉大川。","plain":"六五：違背常理，安居守正就吉祥，不可渡過大河。","insight":"能力不足時，依靠賢者、安守正道則吉。"},{"pos":"上九","text":"上九，由頤，厲吉，利涉大川。","plain":"上九：天下都依靠他得到頤養，責任重大而知危謹慎就吉祥，利於渡過大河。","insight":"成為眾人依靠的人，責任重大，以危懼之心處之則吉。"}]},{"n":28,"name":"大過","sym":"䷛","lower":"巽","upper":"兌","lines":[0,1,1,1,1,0],"meaning":"非常時期，非常作為","judgment":{"text":"大過，棟橈。利有攸往，亨。","plain":"大過卦象徵大大超過常度。屋樑被壓得彎曲。利於有所前往，亨通。","insight":"負擔過重、結構不穩時，需要非常的手段，但要以溫和謙遜的方式推行。"},"image":{"text":"《象》曰：澤滅木，大過，君子以獨立不懼，遯世无悶。","plain":"《象傳》說：澤水淹沒了樹木，這就是大過；君子效法它，獨立自主而無所畏懼，避世隱居也不苦悶。"},"yao":[{"pos":"初六","text":"初六，藉用白茅，无咎。","plain":"初六：用潔白的茅草墊在祭品下面，謹慎至極，沒有過失。","insight":"在大事面前格外謹慎小心，不會出錯。"},{"pos":"九二","text":"九二，枯楊生稊，老夫得其女妻，无不利。","plain":"九二：枯萎的楊樹長出新芽，老人娶到年輕的妻子，沒有不利的。","insight":"枯木逢春，看似不相配的結合，也能帶來新生機。"},{"pos":"九三","text":"九三，棟橈，凶。","plain":"九三：屋樑彎曲，兇險。","insight":"剛愎自用、不聽輔助，結構必將崩壞。"},{"pos":"九四","text":"九四，棟隆，吉，有它吝。","plain":"九四：屋樑高高隆起，吉祥；但若另有牽繫，就會有憾惜。","insight":"能撐起局面就吉祥，但不可另有私心。"},{"pos":"九五","text":"九五，枯楊生華，老婦得其士夫，无咎无譽。","plain":"九五：枯萎的楊樹開出花朵，老婦嫁給年輕的丈夫，沒有過失，也沒有讚譽。","insight":"表面的繁榮缺乏根本，難以長久。"},{"pos":"上六","text":"上六，過涉滅頂，凶，无咎。","plain":"上六：涉水過深，水淹沒了頭頂，兇險，但不可歸咎於他。","insight":"為了大義而犧牲，雖凶而無可指責。"}]},{"n":29,"name":"坎","sym":"䷜","lower":"坎","upper":"坎","lines":[0,1,0,0,1,0],"meaning":"重重險陷，以誠出險","judgment":{"text":"習坎，有孚，維心亨，行有尚。","plain":"習坎卦象徵重重險陷。心中有誠信，內心就能亨通，行動會受到崇尚。","insight":"身處重重困境時，保持內心的誠信與堅定，行動就能有所成就。"},"image":{"text":"《象》曰：水洊至，習坎，君子以常德行，習教事。","plain":"《象傳》說：水接連不斷地流來，這就是習坎；君子效法它，恆常地保持德行，反覆熟習教化之事。"},"yao":[{"pos":"初六","text":"初六，習坎，入于坎窞，凶。","plain":"初六：在重重險陷中，又掉進了坎底的深穴，兇險。","insight":"在險中越陷越深，失去方向，凶險。"},{"pos":"九二","text":"九二，坎有險，求小得。","plain":"九二：在險陷之中仍有危險，追求小的收穫可以得到。","insight":"險中先求小有所得，一步一步來。"},{"pos":"六三","text":"六三，來之坎坎，險且枕，入于坎窞，勿用。","plain":"六三：來去都是險陷，前方危險，後面又倚靠著險；陷入坎底深穴，不可輕舉妄動。","insight":"進退皆險時，不可輕舉妄動，等待時機。"},{"pos":"六四","text":"六四，樽酒簋，貳用缶，納約自牖，終无咎。","plain":"六四：一樽酒、一簋食，用瓦器盛著，以簡樸真誠相待，從窗口納入結約之物，最終沒有過失。","insight":"在困境中以簡樸真誠相待，能結下互助之約。"},{"pos":"九五","text":"九五，坎不盈，祗既平，无咎。","plain":"九五：坎中的水還沒有滿溢，等到與岸齊平，就沒有過失。","insight":"危機尚未完全解除，保持平穩即可無咎。"},{"pos":"上六","text":"上六，繫用徽纆，寘于叢棘，三歲不得，凶。","plain":"上六：用繩索捆綁，放置在荊棘叢中的牢獄裡，三年都不能脫身，兇險。","insight":"迷失正道而陷入長期困境，凶險。"}]},{"n":30,"name":"離","sym":"䷝","lower":"離","upper":"離","lines":[1,0,1,1,0,1],"meaning":"附麗光明，柔順守正","judgment":{"text":"離，利貞，亨。畜牝牛，吉。","plain":"離卦象徵附麗與光明。利於守持正道，可以亨通。蓄養母牛般柔順的德性，吉祥。","insight":"依附正確的事物才能發光；保持柔順謙和的態度，吉祥。"},"image":{"text":"《象》曰：明兩作，離，大人以繼明照于四方。","plain":"《象傳》說：光明接連兩次升起，這就是離；大人效法它，以接續不斷的光明照耀四方。"},"yao":[{"pos":"初九","text":"初九，履錯然，敬之，无咎。","plain":"初九：剛起步時腳步交錯紛亂，保持恭敬謹慎，就沒有過失。","insight":"剛起步時手忙腳亂，保持恭敬謹慎就能避免過錯。"},{"pos":"六二","text":"六二，黃離，元吉。","plain":"六二：附麗於黃色的中道，大為吉祥。","insight":"居中守正，得到最好的依附，大吉。"},{"pos":"九三","text":"九三，日昃之離，不鼓缶而歌，則大耋之嗟，凶。","plain":"九三：太陽西斜時的光明，若不敲著瓦器唱歌、安然自樂，就只會發出年老將盡的嗟嘆，兇險。","insight":"人生黃昏時，要能安然自樂，不要哀嘆衰老。"},{"pos":"九四","text":"九四，突如其來如，焚如，死如，棄如。","plain":"九四：突然而來，像火一樣焚燒，結果死亡，被人拋棄。","insight":"來勢洶洶、急躁冒進的人，終將無處容身。"},{"pos":"六五","text":"六五，出涕沱若，戚嗟若，吉。","plain":"六五：淚流滿面，憂傷嘆息，因能憂懼而吉祥。","insight":"身處高位而心懷憂懼，反而能得吉祥。"},{"pos":"上九","text":"上九，王用出征，有嘉，折首，獲匪其醜，无咎。","plain":"上九：君王因而出兵征伐，有嘉美的功績；只斬除首惡，俘獲的不是脅從的同類，沒有過失。","insight":"清除問題時只懲首惡，不株連無辜。"}]},{"n":31,"name":"咸","sym":"䷞","lower":"艮","upper":"兌","lines":[0,0,1,1,1,0],"meaning":"無心感應，以虛受人","judgment":{"text":"咸，亨，利貞，取女吉。","plain":"咸卦象徵交感，亨通，利於守持正道；娶妻吉祥。","insight":"真誠的感應建立在彼此尊重之上，以謙虛的心接納他人，關係才能長久。"},"image":{"text":"《象》曰：山上有澤，咸，君子以虛受人。","plain":"《象傳》說：山上有澤，山以虛受澤，這就是咸；君子效法它，以虛懷之心接納他人。"},"yao":[{"pos":"初六","text":"初六，咸其拇。","plain":"初六：感應發生在腳的大拇趾上。","insight":"感應剛起，只在表面，還未影響全局。"},{"pos":"六二","text":"六二，咸其腓，凶，居吉。","plain":"六二：感應發生在小腿肚上，妄動則兇險，安居不動就吉祥。","insight":"感受到誘惑就急著行動有凶險，安守則吉。"},{"pos":"九三","text":"九三，咸其股，執其隨，往吝。","plain":"九三：感應發生在大腿上，只知執意跟隨別人行動，前往會有憾惜。","insight":"沒有主見、盲目跟隨他人，前往有憾。"},{"pos":"九四","text":"九四，貞吉，悔亡，憧憧往來，朋從爾思。","plain":"九四：守持正道就吉祥，懊悔消失。若心意不定、往來不絕地思慮，就只有朋類順從你的想法。","insight":"守正則無悔；若患得患失、心思不定，只能影響少數人。"},{"pos":"九五","text":"九五，咸其脢，无悔。","plain":"九五：感應發生在背上的肌肉，沒有懊悔。","insight":"感應淺薄，雖無悔也難有大作為。"},{"pos":"上六","text":"上六，咸其輔頰舌。","plain":"上六：感應發生在牙床、臉頰和舌頭上。","insight":"只靠口舌說服他人，缺乏真誠，難以感人。"}]},{"n":32,"name":"恒","sym":"䷟","lower":"巽","upper":"震","lines":[0,1,1,1,0,0],"meaning":"恆久之道，守常應變","judgment":{"text":"恒，亨，无咎，利貞，利有攸往。","plain":"恒卦象徵恆久。亨通，沒有過失，利於守持正道，利於有所前往。","insight":"能長久堅持正道就能亨通；恆久不是死守，而是在變化中保持方向。"},"image":{"text":"《象》曰：雷風，恒，君子以立不易方。","plain":"《象傳》說：雷與風相伴，這就是恒；君子效法它，立身處世而不改變方向。"},"yao":[{"pos":"初六","text":"初六，浚恒，貞凶，无攸利。","plain":"初六：一開始就深求恆久，即使守正也兇險，沒有什麼好處。","insight":"一開始就要求太深太多，反而無法持久。"},{"pos":"九二","text":"九二，悔亡。","plain":"九二：懊悔消失。","insight":"能長久守住中道，懊悔自然消失。"},{"pos":"九三","text":"九三，不恒其德，或承之羞，貞吝。","plain":"九三：不能恆久地保持德行，有時會招來羞辱，即使守正也有憾惜。","insight":"德行不能持之以恆，終會招來羞辱。"},{"pos":"九四","text":"九四，田无禽。","plain":"九四：田獵卻沒有獵物。","insight":"在錯誤的位置待再久，也不會有收穫。"},{"pos":"六五","text":"六五，恒其德，貞，婦人吉，夫子凶。","plain":"六五：恆久地保持柔順的德行而守正；對婦人來說吉祥，對男子來說兇險。","insight":"堅持順從對某些角色合適，但需要決斷的人不能一味順從。"},{"pos":"上六","text":"上六，振恒，凶。","plain":"上六：躁動不安地求恆久，兇險。","insight":"躁動不安地求變，大而無功。"}]},{"n":33,"name":"遯","sym":"䷠","lower":"艮","upper":"乾","lines":[0,0,1,1,1,1],"meaning":"適時退隱，以退為進","judgment":{"text":"遯，亨，小利貞。","plain":"遯卦象徵退避隱遁。退避就能亨通；小事利於守持正道。","insight":"小人勢長時，懂得適時退避才能保全，小事仍可守正而行。"},"image":{"text":"《象》曰：天下有山，遯，君子以遠小人，不惡而嚴。","plain":"《象傳》說：天下有山，山雖高而天遠避之，這就是遯；君子效法它，遠離小人，不必顯露憎惡，而是保持威嚴。"},"yao":[{"pos":"初六","text":"初六，遯尾，厲，勿用有攸往。","plain":"初六：退避時落在最後面，有危險，不要有所前往。","insight":"退得太晚就有危險，此時不宜再有所動作。"},{"pos":"六二","text":"六二，執之用黃牛之革，莫之勝說。","plain":"六二：用黃牛皮做的繩子牢牢綁住，沒有人能解脫。","insight":"心志堅定，如同被牛皮繩牢牢綁住，不為所動。"},{"pos":"九三","text":"九三，係遯，有疾厲，畜臣妾，吉。","plain":"九三：心有牽繫而不能退避，會有疾患和危險；用來畜養臣僕婢妾，則吉祥。","insight":"心有牽掛而退不了，會疲憊危險；只宜處理小事。"},{"pos":"九四","text":"九四，好遯，君子吉，小人否。","plain":"九四：雖有所喜好也能果斷退避，君子吉祥，小人則做不到。","insight":"君子能割捨所好而退，小人做不到。"},{"pos":"九五","text":"九五，嘉遯，貞吉。","plain":"九五：嘉美合宜地退避，守正吉祥。","insight":"在恰當時機優雅地退出，守正吉祥。"},{"pos":"上九","text":"上九，肥遯，无不利。","plain":"上九：從容寬裕地退避，沒有不利的。","insight":"毫無牽掛、從容退隱，無往不利。"}]},{"n":34,"name":"大壯","sym":"䷡","lower":"乾","upper":"震","lines":[1,1,1,1,0,0],"meaning":"強盛壯大，守正用壯","judgment":{"text":"大壯，利貞。","plain":"大壯卦象徵陽剛強盛，利於守持正道。","insight":"力量強大時更要走正路，非禮勿為。"},"image":{"text":"《象》曰：雷在天上，大壯，君子以非禮弗履。","plain":"《象傳》說：雷在天上轟鳴，這就是大壯；君子效法它，不合於禮的事絕不去做。"},"yao":[{"pos":"初九","text":"初九，壯于趾，征凶有孚。","plain":"初九：強盛表現在腳趾上，急於前進必然兇險，這是可以確信的。","insight":"根基未穩就急於逞強，必遭挫敗。"},{"pos":"九二","text":"九二，貞吉。","plain":"九二：守持正道吉祥。","insight":"強盛時能守中正，吉祥。"},{"pos":"九三","text":"九三，小人用壯，君子用罔，貞厲，羝羊觸藩，羸其角。","plain":"九三：小人恃強而用壯，君子則不這麼做；即使守正也有危險，就像公羊用角去撞籬笆，反被籬笆纏住了角。","insight":"逞強好勝只會像公羊撞籬笆般被困住。"},{"pos":"九四","text":"九四，貞吉，悔亡，藩決不羸，壯于大輿之輹。","plain":"九四：守正吉祥，懊悔消失。籬笆被撞開而角不再被纏住，強盛表現在大車的車軸上，能載重前行。","insight":"以正道行事，障礙自然打開，可以前進。"},{"pos":"六五","text":"六五，喪羊于易，无悔。","plain":"六五：在田界處不知不覺丟失了羊，沒有懊悔。","insight":"不知不覺中失去強勢，但不必懊悔。"},{"pos":"上六","text":"上六，羝羊觸藩，不能退，不能遂，无攸利，艱則吉。","plain":"上六：公羊撞籬笆被纏住，不能後退，也不能前進，沒有什麼好處；若能知道艱難而謹慎，就吉祥。","insight":"進退兩難時，承認艱難、謹慎應對，反而能吉。"}]},{"n":35,"name":"晉","sym":"䷢","lower":"坤","upper":"離","lines":[0,0,0,1,0,1],"meaning":"光明上進，晉升順遂","judgment":{"text":"晉，康侯用錫馬蕃庶，晝日三接。","plain":"晉卦象徵上進。安國的諸侯受到天子賞賜大量的車馬，一天之內被接見三次。","insight":"前途光明時，得到上位者的賞識與重用，宜以德行配位。"},"image":{"text":"《象》曰：明出地上，晉，君子以自昭明德。","plain":"《象傳》說：太陽從地面升起，這就是晉；君子效法它，自己彰顯光明的德行。"},"yao":[{"pos":"初六","text":"初六，晉如摧如，貞吉，罔孚，裕无咎。","plain":"初六：想要上進卻受到摧抑，守正則吉祥；即使暫時得不到別人的信任，只要寬裕自處，就沒有過失。","insight":"上進受阻、不被信任時，寬心守正就無咎。"},{"pos":"六二","text":"六二，晉如愁如，貞吉，受茲介福，于其王母。","plain":"六二：想要上進卻憂愁不已，守正吉祥；將會從祖母那裡接受這份大福。","insight":"上進中有憂慮，守正終能得到長輩的大福。"},{"pos":"六三","text":"六三，眾允，悔亡。","plain":"六三：得到眾人的信任，懊悔消失。","insight":"得到眾人信任，一同上進，懊悔消失。"},{"pos":"九四","text":"九四，晉如鼫鼠，貞厲。","plain":"九四：上進時像貪婪又膽小的鼫鼠，即使守正也有危險。","insight":"像鼫鼠般貪婪又膽怯地鑽營，必有危險。"},{"pos":"六五","text":"六五，悔亡，失得勿恤，往吉，无不利。","plain":"六五：懊悔消失，不必在意得失，前往吉祥，沒有不利的。","insight":"不計得失、專心前進，自然有好結果。"},{"pos":"上九","text":"上九，晉其角，維用伐邑，厲吉无咎，貞吝。","plain":"上九：上進到了頭角般的極點，只宜用來征伐自己的城邑；雖有危險但吉祥、無過失，即使守正也有憾惜。","insight":"上進到極點時，只適合自我整頓，不宜向外擴張。"}]},{"n":36,"name":"明夷","sym":"䷣","lower":"離","upper":"坤","lines":[1,0,1,0,0,0],"meaning":"光明受傷，韜光養晦","judgment":{"text":"明夷，利艱貞。","plain":"明夷卦象徵光明受到傷害，利於在艱難中守持正道。","insight":"環境昏暗、受到壓制時，要隱藏才華、守住正道，忍耐以待時。"},"image":{"text":"《象》曰：明入地中，明夷，君子以莅眾，用晦而明。","plain":"《象傳》說：光明沒入地中，這就是明夷；君子效法它，治理眾人時，外表含蓄隱晦而內心明察。"},"yao":[{"pos":"初九","text":"初九，明夷于飛，垂其翼，君子于行，三日不食。有攸往，主人有言。","plain":"初九：光明受傷時向外飛去，垂下翅膀；君子急於遠行，三天都顧不上吃飯。有所前往時，主人會有閒話責難。","insight":"察覺危機就及早離開，即使受人非議也在所不惜。"},{"pos":"六二","text":"六二，明夷，夷于左股，用拯馬壯，吉。","plain":"六二：光明受傷，傷在左大腿；借助強壯的馬匹來救助，吉祥。","insight":"雖受傷害，若有強力救援，仍可脫險。"},{"pos":"九三","text":"九三，明夷于南狩，得其大首，不可疾貞。","plain":"九三：在光明受傷時向南方征伐，擒獲了首惡；但不可操之過急，要堅守正道。","insight":"時機成熟時剷除元兇，但不可操之過急。"},{"pos":"六四","text":"六四，入于左腹，獲明夷之心，于出門庭。","plain":"六四：進入左腹深處，得知光明受傷者的內心實情，於是走出門庭遠去。","insight":"看清黑暗的真相後，及時抽身離開。"},{"pos":"六五","text":"六五，箕子之明夷，利貞。","plain":"六五：像箕子那樣在光明受傷時隱晦自處，利於守持正道。","insight":"像箕子一樣在逆境中守住內心的光明。"},{"pos":"上六","text":"上六，不明晦，初登于天，後入于地。","plain":"上六：不放光明而昏暗，起初登上天空，後來沉入地下。","insight":"失德之人起初得勢，最終必然自毀。"}]},{"n":37,"name":"家人","sym":"䷤","lower":"離","upper":"巽","lines":[1,0,1,0,1,1],"meaning":"齊家之道，各正其位","judgment":{"text":"家人，利女貞。","plain":"家人卦象徵家庭之道，利於女子守持正道。","insight":"家庭和諧的關鍵在於每個人各守本分；家正則國安。"},"image":{"text":"《象》曰：風自火出，家人，君子以言有物，而行有恆。","plain":"《象傳》說：風從火中生出，由內向外，這就是家人；君子效法它，說話要有實際內容，行為要有恆常準則。"},"yao":[{"pos":"初九","text":"初九，閑有家，悔亡。","plain":"初九：在成家之初就訂立規矩防範，懊悔消失。","insight":"家規要在一開始就建立，防患於未然。"},{"pos":"六二","text":"六二，无攸遂，在中饋，貞吉。","plain":"六二：不自作主張、專斷成事，在家中主持飲食，守正吉祥。","insight":"不專斷、專心照料家中事務，守正吉祥。"},{"pos":"九三","text":"九三，家人嗃嗃，悔厲吉，婦子嘻嘻，終吝。","plain":"九三：治家嚴厲，家人叫苦，雖有懊悔和危險，最終吉祥；若婦人孩子整天嬉笑放縱，最終會有憾惜。","insight":"治家寧嚴勿縱；過度放任終會後悔。"},{"pos":"六四","text":"六四，富家，大吉。","plain":"六四：使家庭富足，大為吉祥。","insight":"善於持家、使家富足，大吉。"},{"pos":"九五","text":"九五，王假有家，勿恤，吉。","plain":"九五：君王以德感化而保有他的家，不必憂慮，吉祥。","insight":"以德感化家人，彼此相愛，不必憂慮。"},{"pos":"上九","text":"上九，有孚威如，終吉。","plain":"上九：心存誠信又有威嚴，最終吉祥。","insight":"以誠信和威嚴持家，關鍵在於嚴以律己。"}]},{"n":38,"name":"睽","sym":"䷥","lower":"兌","upper":"離","lines":[1,1,0,1,0,1],"meaning":"乖違背離，求同存異","judgment":{"text":"睽，小事吉。","plain":"睽卦象徵乖違背離。做小事吉祥。","insight":"意見分歧時不宜做大事，但可以從小事開始尋找共識。"},"image":{"text":"《象》曰：上火下澤，睽，君子以同而異。","plain":"《象傳》說：上為火、下為澤，性質相背，這就是睽；君子效法它，在大同之中保有差異。"},"yao":[{"pos":"初九","text":"初九，悔亡。喪馬，勿逐，自復。見惡人，无咎。","plain":"初九：懊悔消失。丟失了馬，不必去追，它自己會回來。見到惡人也接待他，沒有過失。","insight":"失去的不必強求，終會回來；與不合之人相見，可避免誤會。"},{"pos":"九二","text":"九二，遇主于巷，无咎。","plain":"九二：在小巷中與主人相遇，沒有過失。","insight":"在非正式場合與關鍵人物相遇，也是溝通的機會。"},{"pos":"六三","text":"六三，見輿曳，其牛掣，其人天且劓。无初有終。","plain":"六三：看到車子被往後拖，拉車的牛被牽制住，駕車的人額頭被刺字、鼻子被割掉。開始不好，但最終會有好結果。","insight":"開頭受阻、處處不順，但最終能有好結果。"},{"pos":"九四","text":"九四，睽孤，遇元夫，交孚，厲无咎。","plain":"九四：乖違而孤立，遇到了善良的大丈夫，彼此以誠信相交，雖有危險但沒有過失。","insight":"孤立時遇到志同道合的人，以誠相交，雖危無咎。"},{"pos":"六五","text":"六五，悔亡，厥宗噬膚，往何咎？","plain":"六五：懊悔消失，他的同宗之人像咬柔軟的肉一樣容易相合，前往又有什麼過失呢？","insight":"與自己人和好如初，前往無咎。"},{"pos":"上九","text":"上九，睽孤；見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾。往遇雨則吉。","plain":"上九：乖違而孤立，疑心生暗鬼：看見豬背上沾滿泥巴，又像見到一車的鬼；先拉開弓要射，後來又放下弓。原來不是強盜，而是來求婚的人。前往遇到下雨就吉祥。","insight":"猜疑心重會把朋友看成敵人；放下疑慮，誤會自然冰釋。"}]},{"n":39,"name":"蹇","sym":"䷦","lower":"艮","upper":"坎","lines":[0,0,1,0,1,0],"meaning":"險阻在前，反身修德","judgment":{"text":"蹇，利西南，不利東北，利見大人，貞吉。","plain":"蹇卦象徵行路艱難。利於往西南平坦之地，不利於往東北險阻之地；利於見大人，守正吉祥。","insight":"遇到困難時，要選擇平順之路、尋求貴人相助，並反省自身。"},"image":{"text":"《象》曰：山上有水，蹇。君子以反身脩德。","plain":"《象傳》說：山上有水，行路艱難，這就是蹇；君子效法它，反省自身、修養德行。"},"yao":[{"pos":"初六","text":"初六，往蹇，來譽。","plain":"初六：前往會遇到艱難，回來則得到讚譽。","insight":"冒進只會更難，退而等待反得讚譽。"},{"pos":"六二","text":"六二，王臣蹇蹇，匪躬之故。","plain":"六二：君王的臣子奔走於重重艱難之中，並不是為了自身的緣故。","insight":"為公事鞠躬盡瘁，即使艱難也問心無愧。"},{"pos":"九三","text":"九三，往蹇，來反。","plain":"九三：前往會遇到艱難，回來就能返回原處。","insight":"前行受阻就回來，親近自己人。"},{"pos":"六四","text":"六四，往蹇，來連。","plain":"六四：前往會遇到艱難，回來則能與人聯合。","insight":"獨自前行困難，回來聯合眾人，才有力量。"},{"pos":"九五","text":"九五，大蹇，朋來。","plain":"九五：處於大的艱難之中，朋友前來相助。","insight":"身處大難時，朋友會前來相助。"},{"pos":"上六","text":"上六，往蹇，來碩，吉，利見大人。","plain":"上六：前往會遇到艱難，回來則能成就大功，吉祥；利於見大人。","insight":"不要硬闖，回頭依靠賢者，就能成就大事。"}]},{"n":40,"name":"解","sym":"䷧","lower":"坎","upper":"震","lines":[0,1,0,1,0,0],"meaning":"險難解除，寬和施恩","judgment":{"text":"解，利西南，无所往，其來復吉，有攸往，夙吉。","plain":"解卦象徵險難的解除。利於往西南平易之地。若沒有需要前往處理的事，就回來恢復原狀，吉祥；若有事要前往，及早行動就吉祥。","insight":"危機解除後，應以寬和安定為主，該處理的事要及早處理。"},"image":{"text":"《象》曰：雷雨作，解，君子以赦過宥罪。","plain":"《象傳》說：雷雨興作，這就是解；君子效法它，赦免過失，寬恕罪行。"},"yao":[{"pos":"初六","text":"初六，无咎。","plain":"初六：沒有過失。","insight":"困難剛解除，休養生息即可無咎。"},{"pos":"九二","text":"九二，田獲三狐，得黃矢，貞吉。","plain":"九二：田獵時捕獲三隻狐狸，得到黃色的箭，守正吉祥。","insight":"清除隱患、堅守中道，吉祥。"},{"pos":"六三","text":"六三，負且乘，致寇至，貞吝。","plain":"六三：背著東西又坐在車上，招致強盜到來，即使守正也有憾惜。","insight":"德不配位、炫耀財富，必招來覬覦。"},{"pos":"九四","text":"九四，解而拇，朋至斯孚。","plain":"九四：解開你腳拇趾上的牽絆，朋友才會前來，以誠信相待。","insight":"擺脫小人的牽累，真正的朋友才會到來。"},{"pos":"六五","text":"六五，君子維有解，吉，有孚于小人。","plain":"六五：君子能解除小人的牽累，吉祥；這可以從小人的退去得到驗證。","insight":"君子能擺脫小人，小人自然退去。"},{"pos":"上六","text":"上六，公用射隼于高墉之上，獲之，无不利。","plain":"上六：王公在高高的城牆上射鷹隼，射中了，沒有不利的。","insight":"果斷清除高位上的禍害，無往不利。"}]},{"n":41,"name":"損","sym":"䷨","lower":"兌","upper":"艮","lines":[1,1,0,0,0,1],"meaning":"減損有道，損下益上","judgment":{"text":"損，有孚，元吉，无咎，可貞，利有攸往。","plain":"損卦象徵減損。減損時心存誠信，就大為吉祥，沒有過失，可以守持正道，利於有所前往。","insight":"該減省時減省，只要誠心，簡樸也有價值；損益要順應時機。"},"image":{"text":"《象》曰：山下有澤，損，君子以懲忿窒欲。","plain":"《象傳》說：山下有澤，澤自損以增山之高，這就是損；君子效法它，克制憤怒，堵塞慾望。"},"yao":[{"pos":"初九","text":"初九，已事遄往，无咎，酌損之。","plain":"初九：停下自己的事趕快前往幫助，沒有過失；但要斟酌減損自己的分寸。","insight":"放下手邊事去幫助人，但要衡量自己的能力。"},{"pos":"九二","text":"九二，利貞，征凶，弗損益之。","plain":"九二：利於守持正道，急於前進則兇險；不必減損自己，就能增益他人。","insight":"不必犧牲自己也能幫助他人，守正最好。"},{"pos":"六三","text":"六三，三人行，則損一人，一人行，則得其友。","plain":"六三：三個人同行，就會減損一個人；一個人獨行，就會得到朋友。","insight":"人多容易生疑，專一才能得到真正的夥伴。"},{"pos":"六四","text":"六四，損其疾，使遄有喜，无咎。","plain":"六四：減輕自己的毛病，使它迅速好轉而有喜慶，沒有過失。","insight":"減少自己的缺點，進步就會帶來喜悅。"},{"pos":"六五","text":"六五，或益之十朋之龜，弗克違，元吉。","plain":"六五：有人送來價值十朋的大寶龜，想推辭也推辭不掉，大為吉祥。","insight":"謙虛受益，好處自然送上門來，推也推不掉。"},{"pos":"上九","text":"上九，弗損益之，无咎，貞吉，利有攸往，得臣无家。","plain":"上九：不必減損自己，就能增益他人，沒有過失；守正吉祥，利於有所前往；會得到天下人歸附的臣民，不限於一家一族。","insight":"不損己而能益人，是最大的成就。"}]},{"n":42,"name":"益","sym":"䷩","lower":"震","upper":"巽","lines":[1,0,0,0,1,1],"meaning":"損上益下，見善則遷","judgment":{"text":"益，利有攸往，利涉大川。","plain":"益卦象徵增益，利於有所前往，利於渡過大河。","insight":"上位者讓利於民，百姓喜悅，事業就能順利推進。"},"image":{"text":"《象》曰：風雷，益，君子以見善則遷，有過則改。","plain":"《象傳》說：風與雷相助相長，這就是益；君子效法它，見到善行就向它看齊，有了過錯就立刻改正。"},"yao":[{"pos":"初九","text":"初九，利用為大作，元吉，无咎。","plain":"初九：利於用來做大事業，必須大為吉祥，才沒有過失。","insight":"得到資源支持時，要做出成績才不辜負。"},{"pos":"六二","text":"六二，或益之十朋之龜，弗克違，永貞吉，王用享于帝，吉。","plain":"六二：有人送來價值十朋的大寶龜，想推辭也推辭不掉；永遠守正吉祥。君王用來祭享上帝，吉祥。","insight":"謙虛受益，長久守正，吉祥。"},{"pos":"六三","text":"六三，益之用凶事，无咎。有孚中行，告公用圭。","plain":"六三：用凶險困苦之事來增益他、磨練他，沒有過失。要心存誠信、行合中道，拿著圭玉向王公稟告。","insight":"在困境中得到幫助，要以誠信回報、依循正道。"},{"pos":"六四","text":"六四，中行告公從，利用為依遷國。","plain":"六四：行合中道，向王公稟告，王公聽從；利於依靠它來遷移國都。","insight":"行事中正、取得信任，可以推動重大變革。"},{"pos":"九五","text":"九五，有孚惠心，勿問元吉，有孚惠我德。","plain":"九五：心存誠信、有惠民之心，不用問就知道大吉；百姓也會以誠信感念我的恩德。","insight":"真心為他人謀福利，不必多問必然大吉。"},{"pos":"上九","text":"上九，莫益之，或擊之，立心勿恒，凶。","plain":"上九：沒有人增益他，反而有人攻擊他；存心不能恆常，兇險。","insight":"只顧自己、不肯助人，終會四面受敵。"}]},{"n":43,"name":"夬","sym":"䷪","lower":"乾","upper":"兌","lines":[1,1,1,1,1,0],"meaning":"果決除害，剛中有和","judgment":{"text":"夬，揚于王庭，孚號有厲。告自邑，不利即戎，利有攸往。","plain":"夬卦象徵決斷、清除。要在君王的朝廷上公開宣布小人的罪狀，以誠心號令眾人，並知道其中有危險。要先告誡自己的城邑，不宜立即動用武力，利於有所前往。","insight":"清除弊害要果斷，但要公開、誠信，並以德服人而非單靠武力。"},"image":{"text":"《象》曰：澤上於天，夬，君子以施祿及下，居德則忌。","plain":"《象傳》說：澤水上升到天上，勢必決潰而下，這就是夬；君子效法它，把俸祿施予下面的人，若積聚恩德而自居，就會招人忌恨。"},"yao":[{"pos":"初九","text":"初九，壯于前趾，往不勝為咎。","plain":"初九：強盛表現在前進的腳趾上，前往卻不能取勝，就成為過失。","insight":"準備不足就急於行動，必然失敗。"},{"pos":"九二","text":"九二，惕號，莫夜有戎，勿恤。","plain":"九二：保持警惕而發出號令，即使深夜有敵兵來襲，也不必憂慮。","insight":"保持警惕、做好防備，即使突發變故也不必擔憂。"},{"pos":"九三","text":"九三，壯于頄，有凶，君子夬夬，獨行遇雨，若濡有慍，无咎。","plain":"九三：強盛表現在顴骨上，喜怒形於色，有兇險。君子決心果斷地決除小人，即使獨自前行遇到雨，被淋濕而惹人慍怒，也沒有過失。","insight":"喜怒形於色有凶險；果斷決策，即使暫時被誤解也無妨。"},{"pos":"九四","text":"九四，臀无膚，其行次且；牽羊悔亡，聞言不信。","plain":"九四：臀部沒有皮肉，坐立不安，行走艱難遲疑；若能像牽羊那樣跟在群陽後面，懊悔就會消失，但恐怕聽到這話也不會相信。","insight":"坐立不安、猶豫不決，又聽不進勸告。"},{"pos":"九五","text":"九五，莧陸夬夬，中行无咎。","plain":"九五：像拔除莧陸這種草一樣果斷地決除小人，行合中道就沒有過失。","insight":"對小人要果斷清除，但行事須守中道。"},{"pos":"上六","text":"上六，无號，終有凶。","plain":"上六：再號哭也沒用，最終有兇險。","insight":"小人到了窮途，號哭也無用。"}]},{"n":44,"name":"姤","sym":"䷫","lower":"巽","upper":"乾","lines":[0,1,1,1,1,1],"meaning":"不期而遇，防微杜漸","judgment":{"text":"姤，女壯，勿用取女。","plain":"姤卦象徵不期而遇。女子過於強盛，不要娶這樣的女子。","insight":"不正當的力量悄悄出現時要警惕，不可與之長久結合。"},"image":{"text":"《象》曰：天下有風，姤，后以施命誥四方。","plain":"《象傳》說：天下有風吹行，無處不遇，這就是姤；君王效法它，施發命令，誥告四方。"},"yao":[{"pos":"初六","text":"初六，繫于金柅，貞吉，有攸往，見凶，羸豕孚蹢躅。","plain":"初六：用堅固的金屬煞車器把車子牢牢擋住，守正吉祥；若有所前往，就會遇到兇險。瘦弱的豬一定會躁動不安、伺機亂竄。","insight":"不良苗頭要立刻制止，任其發展必有凶險。"},{"pos":"九二","text":"九二，包有魚，无咎，不利賓。","plain":"九二：廚房裡有魚，沒有過失，但不利於拿去招待賓客。","insight":"把問題控制在自己範圍內，不要擴散出去。"},{"pos":"九三","text":"九三，臀无膚，其行次且，厲，无大咎。","plain":"九三：臀部沒有皮肉，坐立不安，行走艱難遲疑；有危險，但沒有大的過失。","insight":"處境不安、行動艱難，但未鑄大錯。"},{"pos":"九四","text":"九四，包无魚，起凶。","plain":"九四：廚房裡沒有魚，一有行動就兇險。","insight":"失去群眾基礎，一動就有凶險。"},{"pos":"九五","text":"九五，以杞包瓜，含章，有隕自天。","plain":"九五：用杞樹的枝葉包覆瓜果，內含美德而不外露，自然有好事從天而降。","insight":"含蓄內斂、以德服人，好運自會降臨。"},{"pos":"上九","text":"上九，姤其角，吝，无咎。","plain":"上九：遇到的是剛硬的角，有憾惜，但沒有過失。","insight":"態度強硬、處處碰壁，雖有遺憾但無大過。"}]},{"n":45,"name":"萃","sym":"䷬","lower":"坤","upper":"兌","lines":[0,0,0,1,1,0],"meaning":"眾人聚合，以正凝聚","judgment":{"text":"萃，亨，王假有廟，利見大人，亨。利貞，用大牲吉，利有攸往。","plain":"萃卦象徵聚集，亨通。君王以誠心到宗廟祭祀，利於見大人，亨通，利於守持正道。用大的牲畜祭祀吉祥，利於有所前往。","insight":"凝聚人心需要共同的信仰與正當的目標，並做好準備。"},"image":{"text":"《象》曰：澤上於地，萃，君子以除戎器，戒不虞。","plain":"《象傳》說：澤水匯聚在地上，這就是萃；君子效法它，修治兵器，戒備意外的變故。"},"yao":[{"pos":"初六","text":"初六，有孚不終，乃亂乃萃，若號，一握為笑，勿恤，往无咎。","plain":"初六：有誠信卻不能堅持到底，於是心志紊亂、胡亂聚合。若能呼號求助，與正應一握手就破涕為笑；不必憂慮，前往沒有過失。","insight":"信念不堅就會混亂；真誠求助，終能破涕為笑。"},{"pos":"六二","text":"六二，引吉，无咎，孚乃利用禴。","plain":"六二：被人引薦相聚，吉祥，沒有過失；只要心存誠信，即使是簡薄的祭祀也有利。","insight":"被人引薦而聚合，心誠即可。"},{"pos":"六三","text":"六三，萃如嗟如，无攸利，往无咎，小吝。","plain":"六三：想聚合卻不得，只能嗟嘆，沒有什麼好處；前往沒有過失，只是稍有憾惜。","insight":"想融入卻不得其門，前往仍可，只是小有遺憾。"},{"pos":"九四","text":"九四，大吉，无咎。","plain":"九四：必須大為吉祥，才能沒有過失。","insight":"位置不當時，必須做到極好才能無咎。"},{"pos":"九五","text":"九五，萃有位，无咎，匪孚，元永貞，悔亡。","plain":"九五：在聚集時居於尊位，沒有過失；若有人還不信服，就要修養大德、長久守正，懊悔才會消失。","insight":"身居高位，若人心未服，要以德行長久感化。"},{"pos":"上六","text":"上六，齎咨涕洟，无咎。","plain":"上六：嘆息流淚，涕泗交流，沒有過失。","insight":"未能融入群體而嘆息流淚，但無大過。"}]},{"n":46,"name":"升","sym":"䷭","lower":"巽","upper":"坤","lines":[0,1,1,0,0,0],"meaning":"積小成大，順勢上升","judgment":{"text":"升，元亨，用見大人，勿恤，南征吉。","plain":"升卦象徵上升，大為亨通。適合去見大人，不必憂慮；向南方前進吉祥。","insight":"上升之勢已成，宜主動拜見貴人，向光明處前進。"},"image":{"text":"《象》曰：地中生木，升，君子以順德，積小以高大。","plain":"《象傳》說：地中長出樹木，逐漸成長，這就是升；君子效法它，順著德性，從細小處積累而成就高大。"},"yao":[{"pos":"初六","text":"初六，允升，大吉。","plain":"初六：受到信任而上升，大為吉祥。","insight":"得到上級信任而晉升，大吉。"},{"pos":"九二","text":"九二，孚乃利用禴，无咎。","plain":"九二：只要心存誠信，即使是簡薄的祭祀也有利，沒有過失。","insight":"心誠即使禮薄也被接納。"},{"pos":"九三","text":"九三，升虛邑。","plain":"九三：上升如入無人的空城，毫無阻礙。","insight":"上升之路暢通無阻，毫無疑慮。"},{"pos":"六四","text":"六四，王用亨于岐山，吉，无咎。","plain":"六四：君王在岐山舉行祭享，吉祥，沒有過失。","insight":"順應形勢、恭敬行事，吉祥無咎。"},{"pos":"六五","text":"六五，貞吉，升階。","plain":"六五：守正吉祥，像登上台階一樣步步上升。","insight":"按部就班、一步一階往上升，終能實現志向。"},{"pos":"上六","text":"上六，冥升，利于不息之貞。","plain":"上六：昏昧地一味上升，只有用在永不停息地自強守正上才有利。","insight":"盲目追求上升，只有用在自我提升上才有益。"}]},{"n":47,"name":"困","sym":"䷮","lower":"坎","upper":"兌","lines":[0,1,0,1,1,0],"meaning":"身處困境，致命遂志","judgment":{"text":"困，亨，貞，大人吉，无咎，有言不信。","plain":"困卦象徵困窮。處困而能亨通，要守持正道；大人吉祥，沒有過失。此時說話不會被人相信。","insight":"困境中仍能保持內心的通達與堅守，才是君子；此時多說無益。"},"image":{"text":"《象》曰：澤无水，困；君子以致命遂志。","plain":"《象傳》說：澤中的水漏到下面去了，澤裡無水，這就是困；君子效法它，甘願捨棄生命來實現志向。"},"yao":[{"pos":"初六","text":"初六，臀困于株木，入于幽谷，三歲不覿。","plain":"初六：臀部被困在樹樁上，坐立不安，又進入幽暗的山谷，三年都見不到人。","insight":"陷入困境又自我封閉，越陷越深。"},{"pos":"九二","text":"九二，困于酒食，朱紱方來，利用亨祀，征凶，无咎。","plain":"九二：困於酒食之中，紅色的官服即將到來，利於用誠心祭祀；急於前進則兇險，但沒有過失。","insight":"物質富足但精神受困，以誠心面對終能轉機。"},{"pos":"六三","text":"六三，困于石，據于蒺藜，入于其宮，不見其妻，凶。","plain":"六三：被石頭困住，又倚靠在帶刺的蒺藜上；回到家中，見不到自己的妻子，兇險。","insight":"進退失據、四處碰壁，連家人都失去。"},{"pos":"九四","text":"九四，來徐徐，困于金車，吝，有終。","plain":"九四：慢慢地前來，被金車所阻困，有憾惜，但最終會有好結果。","insight":"救援來得遲緩，雖有遺憾，最終仍有結果。"},{"pos":"九五","text":"九五，劓刖，困于赤紱，乃徐有說，利用祭祀。","plain":"九五：受到割鼻、斷足般的傷害，被穿紅色官服的人所困；然後慢慢就有喜悅，利於用誠心祭祀。","insight":"受上下夾擊而困，慢慢就能脫困，宜保持誠敬。"},{"pos":"上六","text":"上六，困于葛藟，于臲卼，曰動悔。有悔，征吉。","plain":"上六：被葛藤纏繞所困，處在動搖不安的高處；心想「一動就會後悔」。若能真正悔悟，前進就吉祥。","insight":"困境中動輒得咎，但若真心悔改，前進則吉。"}]},{"n":48,"name":"井","sym":"䷯","lower":"巽","upper":"坎","lines":[0,1,1,0,1,0],"meaning":"井養不窮，修己利人","judgment":{"text":"井，改邑不改井，无喪无得，往來井井。汔至亦未繘井，羸其瓶，凶。","plain":"井卦象徵水井。城邑可以遷改，水井卻不能遷改；井水不會減少，也不會增多，來來往往的人都從井中汲水。若汲水的繩子快到井口還沒拉出來，或打破了汲水的瓶子，就兇險。","insight":"井的價值在於恆常地滋養眾人；功虧一簣最為可惜。"},"image":{"text":"《象》曰：木上有水，井，君子以勞民勸相。","plain":"《象傳》說：木器之上有水，這就是井；君子效法它，慰勞百姓，勸勉他們互相幫助。"},"yao":[{"pos":"初六","text":"初六，井泥不食，舊井无禽。","plain":"初六：井底都是淤泥，水不能食用；廢舊的井連禽鳥都不來。","insight":"陳舊而失修的資源，已無人問津。"},{"pos":"九二","text":"九二，井谷射鮒，甕敝漏。","plain":"九二：井底的小洞只能射到小魚，汲水的甕也破舊漏水。","insight":"才能未被善用，像井水只能射小魚。"},{"pos":"九三","text":"九三，井渫不食，為我心惻。可用汲，王明並受其福。","plain":"九三：井已經淘洗乾淨卻沒人飲用，令人心中悲傷。井水是可以汲用的，若君王賢明，大家都能一同受到他的福澤。","insight":"賢才未被重用令人惋惜；明主任用，大家都受益。"},{"pos":"六四","text":"六四，井甃，无咎。","plain":"六四：用磚石修砌井壁，沒有過失。","insight":"暫停對外，修整自己，為日後做準備。"},{"pos":"九五","text":"九五，井洌，寒泉食。","plain":"九五：井水清澈，寒冷的泉水可供人飲用。","insight":"品德清明，能真正滋養眾人。"},{"pos":"上六","text":"上六，井收勿幕，有孚元吉。","plain":"上六：汲水完畢不要蓋上井口，讓眾人都能取用；心存誠信，大為吉祥。","insight":"成果開放共享、不藏私，大吉。"}]},{"n":49,"name":"革","sym":"䷰","lower":"離","upper":"兌","lines":[1,0,1,1,1,0],"meaning":"順天應人，適時變革","judgment":{"text":"革，已日乃孚，元亨，利貞，悔亡。","plain":"革卦象徵變革。變革完成之後，才能得到人們的信任；大為亨通，利於守持正道，懊悔就會消失。","insight":"變革要等時機成熟、取得眾人信任後才能成功，並且必須正當。"},"image":{"text":"《象》曰：澤中有火，革，君子以治歷明時。","plain":"《象傳》說：澤中有火，水火相息，這就是革；君子效法它，修訂曆法，辨明時令。"},"yao":[{"pos":"初九","text":"初九，鞏用黃牛之革。","plain":"初九：用黃牛皮牢牢地捆住，堅守而不妄動。","insight":"時機未到時，堅守現狀，不輕舉妄動。"},{"pos":"六二","text":"六二，已日乃革之，征吉，无咎。","plain":"六二：等時機成熟了才進行變革，前往吉祥，沒有過失。","insight":"時機成熟就果斷變革，前往吉祥。"},{"pos":"九三","text":"九三，征凶，貞厲，革言三就，有孚。","plain":"九三：急於前進則兇險，即使守正也有危險；變革的議論經過再三審議而成熟，就會有人信服。","insight":"變革之議要反覆討論、凝聚共識，不可冒進。"},{"pos":"九四","text":"九四，悔亡，有孚，改命，吉。","plain":"九四：懊悔消失，心存誠信，改變天命，吉祥。","insight":"取得信任後推動根本變革，吉祥。"},{"pos":"九五","text":"九五，大人虎變，未占有孚。","plain":"九五：大人像老虎換毛一樣進行變革，文采鮮明；不用占卜就已經得到人們的信任。","insight":"領導者主導的變革光明磊落，不必占卜也能服眾。"},{"pos":"上六","text":"上六，君子豹變，小人革面，征凶，居貞吉。","plain":"上六：君子像豹子換毛一樣隨之變化，小人也改變了面貌而順從；此時再前進就兇險，安居守正則吉祥。","insight":"變革完成後宜鞏固成果，不宜再生事端。"}]},{"n":50,"name":"鼎","sym":"䷱","lower":"巽","upper":"離","lines":[0,1,1,1,0,1],"meaning":"鼎新立業，養賢定命","judgment":{"text":"鼎，元吉亨。","plain":"鼎卦象徵寶鼎與鼎新，大為吉祥，亨通。","insight":"建立新秩序後，要以穩重之態治理，並培養與任用賢才。"},"image":{"text":"《象》曰：木上有火，鼎，君子以正位凝命。","plain":"《象傳》說：木上有火，這就是鼎；君子效法它，端正自己的位置，凝聚並堅守所受的使命。"},"yao":[{"pos":"初六","text":"初六，鼎顛趾，利出否，得妾以其子，无咎。","plain":"初六：鼎腳顛倒過來，正好利於倒出鼎中的污穢；就像娶妾而得到兒子，沒有過失。","insight":"打破舊局、清除污穢，反而是好事。"},{"pos":"九二","text":"九二，鼎有實，我仇有疾，不我能即，吉。","plain":"九二：鼎中裝滿了食物，我的對手雖然嫉妒我，卻不能接近我，吉祥。","insight":"有真才實學，謹慎行事，小人無法傷害你。"},{"pos":"九三","text":"九三，鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。","plain":"九三：鼎耳變了形，鼎無法移動，肥美的雉雞肉也吃不到；等到陰陽相和、下了雨，懊悔就會減少，最終吉祥。","insight":"一時不被重用，等待時機，終會轉好。"},{"pos":"九四","text":"九四，鼎折足，覆公餗，其形渥，凶。","plain":"九四：鼎足折斷，打翻了王公的美食，鼎身被弄得一片狼藉，兇險。","insight":"能力不足卻擔大任，必然搞砸。"},{"pos":"六五","text":"六五，鼎黃耳、金鉉，利貞。","plain":"六五：鼎配上黃色的鼎耳、金屬的鼎槓，利於守持正道。","insight":"居中守正、虛心納賢，有利於守正。"},{"pos":"上九","text":"上九，鼎玉鉉，大吉，无不利。","plain":"上九：鼎配上玉製的鼎槓，大為吉祥，沒有不利的。","insight":"剛柔並濟，大吉無不利。"}]},{"n":51,"name":"震","sym":"䷲","lower":"震","upper":"震","lines":[1,0,0,1,0,0],"meaning":"臨危不亂，恐懼修省","judgment":{"text":"震，亨。震來虩虩，笑言啞啞，震驚百里，不喪匕鬯。","plain":"震卦象徵雷動與震懼，亨通。雷聲震來時令人驚恐，事後卻能談笑自若；雷聲震驚百里之遠，主祭的人卻不失落手中的勺子和香酒。","insight":"面對突變時心存敬畏而不慌亂，事後能談笑自若，才能擔當大任。"},"image":{"text":"《象》曰：洊雷，震，君子以恐懼脩省。","plain":"《象傳》說：雷聲接連而至，這就是震；君子效法它，心存恐懼而修身反省。"},"yao":[{"pos":"初九","text":"初九，震來虩虩，後笑言啞啞，吉。","plain":"初九：雷震來時令人驚恐，事後能談笑自若，吉祥。","insight":"先受驚嚇而後能反省，終得吉祥。"},{"pos":"六二","text":"六二，震來厲，億喪貝，躋于九陵，勿逐，七日得。","plain":"六二：雷震來勢危險，預料會喪失錢財，於是登上高高的山陵躲避；不必追尋，七天後自會失而復得。","insight":"遇到劇變時暫避鋒芒，失去的終會回來。"},{"pos":"六三","text":"六三，震蘇蘇，震行无眚。","plain":"六三：雷震使人惶恐不安，因震懼而行事謹慎，就不會有災禍。","insight":"驚慌失措時謹慎行動，可免災禍。"},{"pos":"九四","text":"九四，震遂泥。","plain":"九四：雷震之後陷入泥中，無法振作。","insight":"在驚變中陷入泥淖，無法振作。"},{"pos":"六五","text":"六五，震往來厲，億无喪，有事。","plain":"六五：雷震往來都有危險，但只要謹慎估量，就不會有所喪失，能保有應做的事業。","insight":"危機頻繁時，只要不失根本，就沒有大損失。"},{"pos":"上六","text":"上六，震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎。婚媾有言。","plain":"上六：雷震使人膽戰心驚，眼神慌亂不安，此時前進則兇險。若雷震還沒到自己身上、只到了鄰居那裡就預先戒備，就沒有過失。但婚姻親家會有閒話。","insight":"看到別人遭殃就預先戒備，可免禍患。"}]},{"n":52,"name":"艮","sym":"䷳","lower":"艮","upper":"艮","lines":[0,0,1,0,0,1],"meaning":"適可而止，動靜得時","judgment":{"text":"艮其背，不獲其身，行其庭，不見其人，无咎。","plain":"艮卦象徵止。止於背後不動之處，就看不見自己的身體，不被私慾牽動；走在庭院中，也看不到旁人。這樣就沒有過失。","insight":"該停就停、該行就行；止於所當止，不為外物所動，就沒有過失。"},"image":{"text":"《象》曰：兼山，艮，君子以思不出其位。","plain":"《象傳》說：兩座山重疊，這就是艮；君子效法它，思慮不超出自己的本位。"},"yao":[{"pos":"初六","text":"初六，艮其趾，无咎，利永貞。","plain":"初六：止住腳趾，不妄動，沒有過失，利於長久守持正道。","insight":"在行動之初就停下來，不犯錯，宜長久守正。"},{"pos":"六二","text":"六二，艮其腓，不拯其隨，其心不快。","plain":"六二：止住小腿肚，卻無法救正自己所跟隨的人，心中不痛快。","insight":"自己想停卻救不了跟隨的對象，內心不快。"},{"pos":"九三","text":"九三，艮其限，列其夤，厲熏心。","plain":"九三：止住腰部，使上下斷裂、背肉分離，危險得像煙火燻心一樣。","insight":"強行抑止反而造成撕裂，令人焦慮不安。"},{"pos":"六四","text":"六四，艮其身，无咎。","plain":"六四：止住自己的身體，沒有過失。","insight":"約束自己的言行，沒有過失。"},{"pos":"六五","text":"六五，艮其輔，言有序，悔亡。","plain":"六五：止住口頰，說話有條有理，懊悔消失。","insight":"說話有分寸、有條理，懊悔自然消失。"},{"pos":"上九","text":"上九，敦艮，吉。","plain":"上九：以敦厚的態度止於至善，吉祥。","insight":"以敦厚的修養止於至善，有始有終。"}]},{"n":53,"name":"漸","sym":"䷴","lower":"艮","upper":"巽","lines":[0,0,1,0,1,1],"meaning":"循序漸進，穩健發展","judgment":{"text":"漸，女歸吉，利貞。","plain":"漸卦象徵循序漸進。女子按禮節逐步出嫁，吉祥；利於守持正道。","insight":"做事要按部就班、循序漸進，像女子依禮出嫁一樣，吉祥。"},"image":{"text":"《象》曰：山上有木，漸，君子以居賢德善俗。","plain":"《象傳》說：山上有樹木，逐漸長高，這就是漸；君子效法它，安居於賢德之中，改善社會風俗。"},"yao":[{"pos":"初六","text":"初六，鴻漸于干，小子厲，有言，无咎。","plain":"初六：大雁漸漸飛到水岸邊；年輕人有危險，會受到言語責難，但沒有過失。","insight":"剛起步時經驗不足，難免被議論，但無大過。"},{"pos":"六二","text":"六二，鴻漸于磐，飲食衎衎，吉。","plain":"六二：大雁漸漸飛到大石上，飲食和樂安適，吉祥。","insight":"漸入佳境，安穩享受成果，但不可坐享其成。"},{"pos":"九三","text":"九三，鴻漸于陸，夫征不復，婦孕不育，凶，利禦寇。","plain":"九三：大雁漸漸飛到高平的陸地上；丈夫出征不再回來，妻子懷孕卻不能生育，兇險；利於抵禦盜寇。","insight":"冒進或離開群體會帶來災禍，宜團結防禦。"},{"pos":"六四","text":"六四，鴻漸于木，或得其桷，无咎。","plain":"六四：大雁漸漸飛到樹上，或許能找到平直的樹枝棲息，沒有過失。","insight":"處境不穩時，找到暫時的安身之處即可。"},{"pos":"九五","text":"九五，鴻漸于陵，婦三歲不孕，終莫之勝，吉。","plain":"九五：大雁漸漸飛到高丘上；妻子三年沒有懷孕，但終究沒有人能阻撓他們相合，吉祥。","insight":"即使長期受阻，正當的結合終究無法被阻撓。"},{"pos":"上九","text":"上九，鴻漸于陸；其羽可用為儀，吉。","plain":"上九：大雁漸漸飛上高空的雲路（朱子認為「陸」應作「逵」）；它的羽毛可以用作典禮的儀飾，吉祥。","insight":"到達最高境界，風範可以成為他人的典範。"}]},{"n":54,"name":"歸妹","sym":"䷵","lower":"兌","upper":"震","lines":[1,1,0,1,0,0],"meaning":"名分不正，知敝慎終","judgment":{"text":"歸妹，征凶，无攸利。","plain":"歸妹卦象徵少女出嫁。主動前往兇險，沒有什麼好處。","insight":"出於衝動或名分不正的結合，前途不利；要考慮長遠的結局。"},"image":{"text":"《象》曰：澤上有雷，歸妹，君子以永終知敝。","plain":"《象傳》說：澤上有雷，這就是歸妹；君子效法它，要追求長久的結局，並預知其中可能的弊病。"},"yao":[{"pos":"初九","text":"初九，歸妹以娣，跛能履，征吉。","plain":"初九：少女以陪嫁的身分出嫁，就像跛腳的人還能走路，前往吉祥。","insight":"處在輔助地位，盡心輔佐也能有所作為。"},{"pos":"九二","text":"九二，眇能視，利幽人之貞。","plain":"九二：就像瞎了一隻眼還能看，利於像幽靜恬淡的人那樣守持正道。","insight":"雖有缺憾，仍宜安守正道。"},{"pos":"六三","text":"六三，歸妹以須，反歸以娣。","plain":"六三：少女出嫁時身分卑賤，只能回頭以陪嫁的身分出嫁。","insight":"身分不當，只能退而求其次。"},{"pos":"九四","text":"九四，歸妹愆期，遲歸有時。","plain":"九四：少女出嫁延誤了婚期，晚些出嫁，是在等待適當的時機。","insight":"錯過時機不必急，耐心等待更好的機緣。"},{"pos":"六五","text":"六五，帝乙歸妹，其君之袂，不如其娣之袂良。月幾望，吉。","plain":"六五：帝乙嫁出妹妹，她身為正室的衣袖，還不如陪嫁女子的衣袖華美。像月亮將圓而未滿一樣謙退，吉祥。","insight":"重內涵而不重外表，謙退自守，吉祥。"},{"pos":"上六","text":"上六，女承筐无實，士刲羊无血，无攸利。","plain":"上六：女子捧著竹筐卻沒有東西，男子殺羊卻沒有血，祭禮不能完成，沒有什麼好處。","insight":"徒具形式而無實質，沒有任何好處。"}]},{"n":55,"name":"豐","sym":"䷶","lower":"離","upper":"震","lines":[1,0,1,1,0,0],"meaning":"豐盛盛大，盛極防衰","judgment":{"text":"豐，亨，王假之，勿憂，宜日中。","plain":"豐卦象徵豐盛盛大，亨通。君王能達到這種盛大的境地；不必憂慮，應當像正午的太陽一樣普照天下。","insight":"事業達到巔峰時，應像正午之日普照天下，但要明白盛極必衰。"},"image":{"text":"《象》曰：雷電皆至，豐，君子以折獄致刑。","plain":"《象傳》說：雷與電一齊到來，這就是豐；君子效法它，審斷訴訟，施行刑罰。"},"yao":[{"pos":"初九","text":"初九，遇其配主，雖旬无咎，往有尚。","plain":"初九：遇到與自己相配的主人，即使彼此相等也沒有過失，前往會受到崇尚。","insight":"遇到匹配的夥伴，平等合作則無咎，爭強則有災。"},{"pos":"六二","text":"六二，豐其蔀，日中見斗，往得疑疾，有孚發若，吉。","plain":"六二：用草席把屋子遮蔽得很嚴密，以至於正午時分就能看見北斗星；前往會被猜疑忌恨。若能以誠信去感發對方，就吉祥。","insight":"被蒙蔽而受猜疑時，以誠信感化對方，吉祥。"},{"pos":"九三","text":"九三，豐其沛，日中見沬，折其右肱，无咎。","plain":"九三：用帷幔把屋子遮蔽得更加嚴密，正午時分連小星都能看見；折斷了右臂，但沒有過失。","insight":"受到嚴重蒙蔽，難以施展，但並非自己的過錯。"},{"pos":"九四","text":"九四，豐其蔀，日中見斗，遇其夷主，吉。","plain":"九四：用草席把屋子遮蔽得很嚴密，正午時分就能看見北斗星；遇到與自己相當的主人，吉祥。","insight":"處境昏暗時，遇到志同道合的人就吉祥。"},{"pos":"六五","text":"六五，來章，有慶譽，吉。","plain":"六五：招來有章美才德的人，會有福慶與美譽，吉祥。","insight":"招攬人才，能帶來榮譽與福慶。"},{"pos":"上六","text":"上六，豐其屋，蔀其家，闚其戶，闃其无人，三歲不覿，凶。","plain":"上六：把房屋蓋得高大豐盛，卻用草席遮蔽自己的家；從門縫往裡看，寂靜無人，三年都見不到人，兇險。","insight":"高傲自大、閉門自守，終將孤立無援。"}]},{"n":56,"name":"旅","sym":"䷷","lower":"艮","upper":"離","lines":[0,0,1,1,0,1],"meaning":"羈旅在外，謙柔守正","judgment":{"text":"旅，小亨，旅貞吉。","plain":"旅卦象徵羈旅在外，小事亨通；旅途中守持正道就吉祥。","insight":"身在異鄉或處境不穩時，只能小有所成，謙和守正才能平安。"},"image":{"text":"《象》曰：山上有火，旅，君子以明慎用刑，而不留獄。","plain":"《象傳》說：山上有火，火勢遷移不停，這就是旅；君子效法它，明察而謹慎地使用刑罰，不拖延獄訟。"},"yao":[{"pos":"初六","text":"初六，旅瑣瑣，斯其所取災。","plain":"初六：旅途中斤斤計較、行為猥瑣，這正是自取災禍。","insight":"在外斤斤計較、格局狹小，是自取其禍。"},{"pos":"六二","text":"六二，旅即次，懷其資，得童僕貞。","plain":"六二：旅途中到了住宿之處，懷裡帶著錢財，又得到忠心守正的童僕。","insight":"有安身之處、有資源、有可靠的幫手，旅途順利。"},{"pos":"九三","text":"九三，旅焚其次，喪其童僕，貞厲。","plain":"九三：旅途中住宿之處被火燒毀，又失去了童僕，即使守正也有危險。","insight":"在外態度傲慢，會失去住所與幫手。"},{"pos":"九四","text":"九四，旅于處，得其資斧，我心不快。","plain":"九四：旅途中暫時找到了安身之處，得到了錢財和斧頭，但我心裡並不痛快。","insight":"暫時安頓下來，但未得其位，心中不快。"},{"pos":"六五","text":"六五，射雉，一矢亡，終以譽命。","plain":"六五：射野雞，雖然損失了一支箭，最終卻獲得美譽和爵命。","insight":"付出小代價，換來好名聲與機會。"},{"pos":"上九","text":"上九，鳥焚其巢，旅人先笑後號咷，喪牛于易，凶。","plain":"上九：鳥巢被火燒毀；旅人先是歡笑，後來號啕大哭；在田界處不知不覺丟失了牛，兇險。","insight":"在外高傲自大，先樂後悲，損失慘重。"}]},{"n":57,"name":"巽","sym":"䷸","lower":"巽","upper":"巽","lines":[0,1,1,0,1,1],"meaning":"謙遜順入，申命行事","judgment":{"text":"巽，小亨，利有攸往，利見大人。","plain":"巽卦象徵謙遜順入，小事亨通，利於有所前往，利於見大人。","insight":"以柔和謙遜的方式推行政令，循序滲透，利於追隨賢者。"},"image":{"text":"《象》曰：隨風，巽，君子以申命行事。","plain":"《象傳》說：風接連吹拂，這就是巽；君子效法它，反覆申明命令，推行政事。"},"yao":[{"pos":"初六","text":"初六，進退，利武人之貞。","plain":"初六：進退猶疑不決，利於像武人那樣果斷守正。","insight":"猶豫不決時，要像軍人一樣果斷堅定。"},{"pos":"九二","text":"九二，巽在牀下，用史巫紛若，吉，无咎。","plain":"九二：謙卑到伏在床下，若能像史官、巫祝那樣以繁多的誠意上達神明，吉祥，沒有過失。","insight":"過度謙卑時，以誠心溝通上下，可得吉祥。"},{"pos":"九三","text":"九三，頻巽，吝。","plain":"九三：一再勉強地表現謙遜，有憾惜。","insight":"一再勉強的謙順，令人遺憾。"},{"pos":"六四","text":"六四，悔亡，田獲三品。","plain":"六四：懊悔消失，田獵時捕獲了三類獵物。","insight":"謙遜行事而有收穫，懊悔消失。"},{"pos":"九五","text":"九五，貞吉，悔亡，无不利。无初有終。先庚三日，後庚三日，吉。","plain":"九五：守正吉祥，懊悔消失，沒有不利的。開始不好，但最終有好結果。在庚日之前三天謹慎謀劃，在庚日之後三天仔細省察，吉祥。","insight":"變更政策前後周詳考慮，開頭雖難而結果好。"},{"pos":"上九","text":"上九，巽在牀下，喪其資斧，貞凶。","plain":"上九：謙卑到伏在床下，失去了錢財和斧頭，即使守正也兇險。","insight":"謙卑過度而失去立場與資源，即使守正也凶。"}]},{"n":58,"name":"兌","sym":"䷹","lower":"兌","upper":"兌","lines":[1,1,0,1,1,0],"meaning":"和悅相處，說以利貞","judgment":{"text":"兌，亨，利貞。","plain":"兌卦象徵喜悅，亨通，利於守持正道。","insight":"以喜悅的心與人交往能亨通，但喜悅必須建立在正道上。"},"image":{"text":"《象》曰：麗澤，兌，君子以朋友講習。","plain":"《象傳》說：兩澤相連、互相滋潤，這就是兌；君子效法它，與朋友一同講論、研習學問。"},"yao":[{"pos":"初九","text":"初九，和兌，吉。","plain":"初九：以平和的態度與人相悅，吉祥。","insight":"以平和之心與人相悅，不起疑心，吉祥。"},{"pos":"九二","text":"九二，孚兌，吉，悔亡。","plain":"九二：以誠信與人相悅，吉祥，懊悔消失。","insight":"以誠信為基礎的快樂，懊悔自消。"},{"pos":"六三","text":"六三，來兌，凶。","plain":"六三：主動前來求取喜悅，兇險。","insight":"刻意討好、主動求悅，必有凶險。"},{"pos":"九四","text":"九四，商兌未寧，介疾有喜。","plain":"九四：斟酌權衡該悅於誰而心中不安；若能隔絕小人的毛病，就會有喜慶。","insight":"在誘惑中權衡掙扎，遠離小人才有喜慶。"},{"pos":"九五","text":"九五，孚于剝，有厲。","plain":"九五：信任了會剝損陽剛的小人，有危險。","insight":"輕信會剝損自己的小人，要提高警覺。"},{"pos":"上六","text":"上六，引兌。","plain":"上六：引誘他人一同求取喜悅。","insight":"引誘他人一同沉溺享樂，格局不夠光明。"}]},{"n":59,"name":"渙","sym":"䷺","lower":"坎","upper":"巽","lines":[0,1,0,0,1,1],"meaning":"化解渙散，凝聚人心","judgment":{"text":"渙，亨，王假有廟，利涉大川，利貞。","plain":"渙卦象徵渙散與化解，亨通。君王以誠心到宗廟祭祀，以凝聚人心；利於渡過大河，利於守持正道。","insight":"人心渙散時，要以共同的信念與精神重新凝聚。"},"image":{"text":"《象》曰：風行水上，渙，先王以享于帝立廟。","plain":"《象傳》說：風在水面上吹行，水波四散，這就是渙；古代君王效法它，祭享上帝、建立宗廟，以凝聚人心。"},"yao":[{"pos":"初六","text":"初六，用拯，馬壯，吉。","plain":"初六：借助強壯的馬匹來拯救渙散，吉祥。","insight":"渙散之初就及時挽救，借助強大力量，吉祥。"},{"pos":"九二","text":"九二，渙奔其机，悔亡。","plain":"九二：在渙散之時奔向可以倚靠的几案，懊悔消失。","insight":"在動盪中找到可依靠的支撐，懊悔消失。"},{"pos":"六三","text":"六三，渙其躬，无悔。","plain":"六三：化解自身的私心，沒有懊悔。","insight":"放下自我私心，以大局為重。"},{"pos":"六四","text":"六四，渙其群，元吉，渙有丘，匪夷所思。","plain":"六四：化解私結的朋黨，大為吉祥；渙散小群而聚成如山丘般的大群，這不是平常人所能想到的。","insight":"打破小團體，凝聚成大團體，非常人所能及。"},{"pos":"九五","text":"九五，渙汗其大號，渙王居，无咎。","plain":"九五：在渙散之時，像汗水發出那樣發布重大號令；散發君王積聚的財物，沒有過失。","insight":"在危機中果斷發布號令、分享資源，安定人心。"},{"pos":"上九","text":"上九，渙其血去，逖出，无咎。","plain":"上九：化解傷害，遠遠地離開，沒有過失。","insight":"遠離禍害、避開傷害，就沒有過失。"}]},{"n":60,"name":"節","sym":"䷻","lower":"兌","upper":"坎","lines":[1,1,0,0,1,0],"meaning":"節制有度，甘節不苦","judgment":{"text":"節，亨，苦節，不可貞。","plain":"節卦象徵節制，亨通。但過度而令人痛苦的節制，不可以一直堅持。","insight":"凡事要有節度，但過度苛刻的節制無法持久。"},"image":{"text":"《象》曰：澤上有水，節，君子以制數度，議德行。","plain":"《象傳》說：澤上有水，澤容水有限度，這就是節；君子效法它，制定禮數法度，評議德行。"},"yao":[{"pos":"初九","text":"初九，不出戶庭，无咎。","plain":"初九：不走出內院的門戶，沒有過失。","insight":"時機未到時，謹守門戶、不出門，不會出錯。"},{"pos":"九二","text":"九二，不出門庭，凶。","plain":"九二：不走出外院的大門，兇險。","insight":"該出門時不出門，錯失良機必有凶險。"},{"pos":"六三","text":"六三，不節若，則嗟若，无咎。","plain":"六三：不知節制，就只能嗟嘆後悔；這又能怪誰呢？","insight":"不知節制，最後只能自嘆，怪不得別人。"},{"pos":"六四","text":"六四，安節，亨。","plain":"六四：安然地實行節制，亨通。","insight":"自然而然地安於節制，亨通。"},{"pos":"九五","text":"九五，甘節，吉。往有尚。","plain":"九五：以甘美適中的方式節制，吉祥；前往會受到崇尚。","insight":"恰到好處的節制讓人樂於遵行，吉祥。"},{"pos":"上六","text":"上六，苦節，貞凶，悔亡。","plain":"上六：過度痛苦的節制，即使守正也兇險；但若能以此自律，懊悔就會消失。","insight":"過度苛刻的節制即使正確也凶險，但可避免後悔。"}]},{"n":61,"name":"中孚","sym":"䷼","lower":"兌","upper":"巽","lines":[1,1,0,0,1,1],"meaning":"中心誠信，感化萬物","judgment":{"text":"中孚，豚魚吉，利涉大川，利貞。","plain":"中孚卦象徵內心誠信。誠信能感化像小豬和魚這樣無知的生物，吉祥；利於渡過大河，利於守持正道。","insight":"真誠能感化一切，即使是最難感化的對象；以誠信行事，能克服險阻。"},"image":{"text":"《象》曰：澤上有風，中孚，君子以議獄緩死。","plain":"《象傳》說：澤上有風吹拂，無所不及，這就是中孚；君子效法它，審慎評議訟案，寬緩死刑。"},"yao":[{"pos":"初九","text":"初九，虞吉，有他不燕。","plain":"初九：安守本分而有所度量，吉祥；若另有他求，就不得安寧。","insight":"安守本分、專心如一，三心二意就不得安寧。"},{"pos":"九二","text":"九二，鳴鶴在陰，其子和之。我有好爵，吾與爾靡之。","plain":"九二：鶴在山北的樹蔭下鳴叫，它的孩子在遠處應和。我有一杯好酒，願與你一同分享。","insight":"真誠的心意，遠方也會有人共鳴。"},{"pos":"六三","text":"六三，得敵，或鼓或罷，或泣或歌。","plain":"六三：遇到了對手，有時擊鼓進攻，有時疲憊停止，有時哭泣，有時歌唱，反覆無常。","insight":"情緒起伏不定，遇到對手時進退失據。"},{"pos":"六四","text":"六四，月幾望，馬匹亡，无咎。","plain":"六四：像月亮將圓而未滿，拉車的兩匹馬失去了其中一匹，沒有過失。","insight":"擺脫私黨，一心向上，沒有過失。"},{"pos":"九五","text":"九五，有孚攣如，无咎。","plain":"九五：以誠信緊密地聯繫天下，沒有過失。","insight":"以誠信凝聚人心，緊密團結。"},{"pos":"上九","text":"上九，翰音登于天，貞凶。","plain":"上九：雞鳴之聲妄想登上高天，即使守正也兇險。","insight":"名過其實、聲音高揚而無誠意，不能長久。"}]},{"n":62,"name":"小過","sym":"䷽","lower":"艮","upper":"震","lines":[0,0,1,1,0,0],"meaning":"小有過越，宜下不宜上","judgment":{"text":"小過，亨，利貞。可小事，不可大事。飛鳥遺之音，不宜上，宜下，大吉。","plain":"小過卦象徵稍有過度，亨通，利於守持正道。可以做小事，不可以做大事。飛鳥留下鳴叫聲，不宜向上高飛，宜於向下棲止，這樣就大為吉祥。","insight":"可以做小事而不宜做大事；態度上寧可稍微過於謙恭，不宜好高騖遠。"},"image":{"text":"《象》曰：山上有雷，小過。君子以行過乎恭，喪過乎哀，用過乎儉。","plain":"《象傳》說：山上有雷，雷聲稍過其常，這就是小過；君子效法它，行為稍過於恭敬，喪事稍過於哀傷，用度稍過於節儉。"},"yao":[{"pos":"初六","text":"初六，飛鳥以凶。","plain":"初六：飛鳥一味向上高飛，因而兇險。","insight":"一開始就好高騖遠，必然凶險。"},{"pos":"六二","text":"六二，過其祖，遇其妣，不及其君，遇其臣，无咎。","plain":"六二：越過了祖父，遇到了祖母；不僭越君主，只到臣子的本分為止，沒有過失。","insight":"適度越級但不僭越，守住臣子的本分。"},{"pos":"九三","text":"九三，弗過防之，從或戕之，凶。","plain":"九三：不肯過度地加以防備，就可能有人從後面加害他，兇險。","insight":"不加防範，就可能被人暗算。"},{"pos":"九四","text":"九四，无咎，弗過遇之，往厲必戒，勿用永貞。","plain":"九四：沒有過失，不過分剛強而恰好合宜。前往有危險，必須警戒；不可固執地長守不變。","insight":"不過分剛強，遇事警戒，不可固執。"},{"pos":"六五","text":"六五，密雲不雨，自我西郊，公弋取彼在穴。","plain":"六五：烏雲密布卻還沒下雨，雲從我西邊的郊外而來；王公用繫繩的箭射取藏在洞穴中的獵物。","insight":"有心無力，需要找到合適的人來協助。"},{"pos":"上六","text":"上六，弗遇過之，飛鳥離之，凶，是謂災眚。","plain":"上六：不能恰當合宜而過度了，像飛鳥飛得太高而遭羅網，兇險，這就叫做災禍。","insight":"一意孤行、過度高亢，必遭災禍。"}]},{"n":63,"name":"既濟","sym":"䷾","lower":"離","upper":"坎","lines":[1,0,1,0,1,0],"meaning":"事已完成，思患預防","judgment":{"text":"既濟，亨小，利貞。初吉，終亂。","plain":"既濟卦象徵事已完成。小事亨通，利於守持正道。開始時吉祥，最後則容易出亂。","insight":"成功之後最容易鬆懈，起初吉祥，最後卻可能生亂，要居安思危。"},"image":{"text":"《象》曰：水在火上，既濟，君子以思患而預防之。","plain":"《象傳》說：水在火上，水火相濟，這就是既濟；君子效法它，想到可能發生的禍患而預先防範。"},"yao":[{"pos":"初九","text":"初九，曳其輪，濡其尾，无咎。","plain":"初九：拖住車輪，沾濕了尾巴，謹慎不冒進，沒有過失。","insight":"成功之際仍放慢腳步、謹慎行事，沒有過失。"},{"pos":"六二","text":"六二，婦喪其茀，勿逐，七日得。","plain":"六二：婦人丟失了車上的遮簾，不必去追尋，七天後自會失而復得。","insight":"失去的東西不必急著追，時候到了自會回來。"},{"pos":"九三","text":"九三，高宗伐鬼方，三年克之，小人勿用。","plain":"九三：殷高宗討伐鬼方，經過三年才戰勝；不可任用小人。","insight":"即使強大，完成大事也要付出艱辛，不可任用小人。"},{"pos":"六四","text":"六四，繻有衣袽，終日戒。","plain":"六四：船有漏洞，準備好破布衣絮隨時堵塞，整天保持戒備。","insight":"時刻做好準備，防範潛在的漏洞。"},{"pos":"九五","text":"九五，東鄰殺牛，不如西鄰之禴祭，實受其福。","plain":"九五：東邊的鄰居殺牛盛祭，還不如西邊鄰居簡樸的禴祭，更能實際得到福分。","insight":"誠心比排場更重要，簡樸而及時的付出更得福。"},{"pos":"上六","text":"上六，濡其首，厲。","plain":"上六：渡河沾濕了頭，有危險。","insight":"得意忘形、過度深入，必有危險。"}]},{"n":64,"name":"未濟","sym":"䷿","lower":"坎","upper":"離","lines":[0,1,0,1,0,1],"meaning":"事尚未成，慎始慎終","judgment":{"text":"未濟，亨。小狐汔濟，濡其尾，无攸利。","plain":"未濟卦象徵事尚未完成，仍可亨通。小狐狸快要渡過河時，沾濕了尾巴，沒有什麼好處。","insight":"事情尚未完成，仍有成功的可能，但若後繼無力，前功盡棄。"},"image":{"text":"《象》曰：火在水上，未濟，君子以慎辨物居方。","plain":"《象傳》說：火在水上，水火不相交，這就是未濟；君子效法它，謹慎地辨別事物，使它們各居其所。"},"yao":[{"pos":"初六","text":"初六，濡其尾，吝。","plain":"初六：沾濕了尾巴，有憾惜。","insight":"不知自己的極限就貿然行動，必有遺憾。"},{"pos":"九二","text":"九二，曳其輪，貞吉。","plain":"九二：拖住車輪，不急於前進，守正吉祥。","insight":"放慢腳步、穩紮穩打，守正吉祥。"},{"pos":"六三","text":"六三，未濟，征凶，利涉大川。","plain":"六三：尚未渡過，急於前進則兇險；但利於渡過大河。","insight":"準備不足時強行推進凶險，但仍可尋求突破。"},{"pos":"九四","text":"九四，貞吉，悔亡。震用伐鬼方，三年有賞于大國。","plain":"九四：守正吉祥，懊悔消失。奮發震動地討伐鬼方，三年後受到大國的封賞。","insight":"堅持正道、奮發努力，終能獲得大成就。"},{"pos":"六五","text":"六五，貞吉，无悔。君子之光，有孚，吉。","plain":"六五：守正吉祥，沒有懊悔。君子的光輝，心存誠信，吉祥。","insight":"堅守正道，君子的光輝能感化眾人。"},{"pos":"上九","text":"上九，有孚于飲酒，无咎。濡其首，有孚失是。","plain":"上九：心存誠信而安閒飲酒，沒有過失。但若放縱到沾濕了頭，即使有誠信也會失去正道。","insight":"在成功前夕自信安閒無妨，但沉溺放縱就會失去一切。"}]}];
(function(){
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const BY = {}; HEX.forEach(h => BY[h.lines.join('')] = h);
const NATURE = {乾:'天',兌:'澤',離:'火',震:'雷',巽:'風',坎:'水',艮:'山',坤:'地'};
const fullName = h => h.name.length === 1 ? h.name + '卦' : h.name;
const POS = ['初','二','三','四','五','上'];

/* ---------- 爻與起卦結果 ---------- */
// 6 老陰、7 少陽、8 少陰、9 老陽
const isYang = v => v === 7 || v === 9;
const isChg = v => v === 6 || v === 9;
function makeReading(yaos){
  const prim = BY[yaos.map(v => isYang(v) ? 1 : 0).join('')];
  const ch = yaos.map((v,i) => isChg(v) ? i : -1).filter(i => i >= 0);
  const chg = ch.length ? BY[yaos.map(v => (isChg(v) ? !isYang(v) : isYang(v)) ? 1 : 0).join('')] : null;
  return {yaos, prim, chg, ch};
}
// 朱子《易學啟蒙》占法
function guidance(r){
  const p = r.prim, c = r.chg, ch = r.ch;
  const yi = (h, i, tag, main) => ({title: tag + fullName(h) + '　' + h.yao[i].pos + (main ? '（為主）' : ''), ...h.yao[i]});
  const ji = (h, tag, main) => ({title: tag + fullName(h) + '　卦辭' + (main ? '（為主）' : ''), text: h.judgment.text, plain: h.judgment.plain, insight: h.judgment.insight});
  const still = [0,1,2,3,4,5].filter(i => !ch.includes(i));
  switch (ch.length) {
    case 0: return {rule:'六爻皆不變：占本卦卦辭。', items:[ji(p,'本卦')]};
    case 1: return {rule:'一爻變：以本卦變爻（' + POS[ch[0]] + '爻）之辭占。', items:[yi(p,ch[0],'本卦',true)]};
    case 2: return {rule:'二爻變：以本卦二變爻之辭占，以上爻為主。', items:[yi(p,ch[1],'本卦',true), yi(p,ch[0],'本卦',false)]};
    case 3: return {rule:'三爻變：占本卦及之卦之卦辭，以本卦為主。', items:[ji(p,'本卦',true), ji(c,'之卦')]};
    case 4: return {rule:'四爻變：以之卦二不變爻之辭占，以下爻為主。', items:[yi(c,still[0],'之卦',true), yi(c,still[1],'之卦',false)]};
    case 5: return {rule:'五爻變：以之卦不變爻之辭占。', items:[yi(c,still[0],'之卦',true)]};
    default:
      if (p.n === 1 || p.n === 2) return {rule:'六爻皆變：乾占「用九」，坤占「用六」。', items:[yi(p,6,'本卦',true)]};
      return {rule:'六爻皆變：占之卦卦辭。', items:[ji(c,'之卦',true)]};
  }
}

/* ---------- 動畫工具 ---------- */
function bezier(x1,y1,x2,y2){
  const cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx, cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
  const sx=t=>((ax*t+bx)*t+cx)*t, sy=t=>((ay*t+by)*t+cy)*t, dx=t=>(3*ax*t+2*bx)*t+cx;
  return x => { let t=x; for (let i=0;i<8;i++){ const e=sx(t)-x, d=dx(t); if (Math.abs(e)<1e-6||!d) break; t-=e/d; }
    return sy(Math.min(1,Math.max(0,t))); };
}
const spinEase = bezier(0.12, 0.55, 0.2, 1);
const easeOut = t => 1 - Math.pow(1 - t, 3);
function fitCanvas(cv){
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w:r.width, h:r.height};
}

/* ---------- 八面柱 ---------- */
// 老陽 1、少陽 3、少陰 3、老陰 1，與三枚銅錢機率相同
const FACES = [7,8,9,8,7,6,7,8];
const HALF = 22.5 * Math.PI / 180;
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); ctx.fill(); }
function drawRod(rod){
  const {ctx, w, h} = rod.g;
  ctx.clearRect(0,0,w,h);
  ctx.save(); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(0,0,w,h,6) : ctx.rect(0,0,w,h); ctx.clip();
  ctx.fillStyle = '#8c8c8c'; ctx.fillRect(0,0,w,h);
  const rc = h/2, cy = h/2, base = rod.angle * Math.PI / 180;
  for (let k=0;k<8;k++){
    const phi = base + k*Math.PI/4, f = Math.cos(phi);
    if (f <= 0.02) continue;
    const y1 = cy - rc*Math.sin(phi+HALF), y2 = cy - rc*Math.sin(phi-HALF);
    const top = Math.min(y1,y2), fh = Math.abs(y2-y1);
    if (fh < .5) continue;
    const L = 0.70 + 0.30*f;
    ctx.fillStyle = `rgb(${255*L|0},${255*L*.985|0},${255*L*.955|0})`;
    ctx.fillRect(0, top, w, fh);
    ctx.fillStyle = `rgba(0,0,0,${0.10+0.15*(1-f)})`; ctx.fillRect(0, top, w, .6);
    // 爻
    const v = FACES[k], barH = fh*0.36, y = top + fh/2 - barH/2;
    const left = w*0.08, right = w - w*0.16, len = right-left, rad = Math.min(barH*.18,3);
    const a = 0.35 + 0.65*f; ctx.fillStyle = `rgba(18,18,18,${a})`; ctx.strokeStyle = ctx.fillStyle;
    if (isYang(v)) rr(ctx,left,y,len,barH,rad);
    else { const gap=len*.16, seg=(len-gap)/2; rr(ctx,left,y,seg,barH,rad); rr(ctx,left+seg+gap,y,seg,barH,rad); }
    if (isChg(v)){
      const s = Math.min(fh*.42, w*.06), cx = w - w*.08, my = top + fh/2;
      ctx.lineWidth = Math.max(1.5, s*.16); ctx.beginPath();
      if (v === 9) ctx.arc(cx, my, s/2, 0, Math.PI*2);
      else { ctx.moveTo(cx-s/2,my-s/2); ctx.lineTo(cx+s/2,my+s/2); ctx.moveTo(cx+s/2,my-s/2); ctx.lineTo(cx-s/2,my+s/2); }
      ctx.stroke();
    }
  }
  const gr = ctx.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'rgba(255,255,255,.18)'); gr.addColorStop(.35,'rgba(255,255,255,0)');
  gr.addColorStop(.65,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.22)');
  ctx.fillStyle = gr; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0,0,6,h); ctx.fillRect(w-6,0,6,h);
  ctx.restore();
}
function targetAngle(cur, k, spins){
  const norm = ((360 - k*45) % 360 + 360) % 360;
  let t = (Math.floor(cur/360) + spins)*360 + norm;
  while (t < cur + spins*360) t += 360;
  return t;
}

const rods = [];
for (let i=0;i<6;i++){                       // i=0 為初爻，畫在最下面
  const cv = document.createElement('canvas');
  $('rods').prepend(cv);
  rods.push({cv, angle: -45*Math.floor(Math.random()*8), anim:null, g:null});
}
function layoutRods(){ rods.forEach(r => { r.g = fitCanvas(r.cv); drawRod(r); }); }

let mainReading = null, spinning = false;
function loop(now){
  let active = false;
  rods.forEach(r => {
    if (!r.anim) return;
    const p = Math.min(1, (now - r.anim.t0) / r.anim.dur);
    r.angle = r.anim.from + (r.anim.to - r.anim.from) * spinEase(p);
    drawRod(r);
    if (p >= 1) { r.anim = null; } else active = true;
  });
  if (active) requestAnimationFrame(loop);
}
function cast(){
  if (spinning) return;
  spinning = true; mainReading = null;
  $('side').classList.remove('on'); $('cap').classList.remove('on');
  $('castBtn').disabled = $('coinBtn').disabled = true; $('hint').textContent = '靜心……';
  const picks = rods.map(() => Math.floor(Math.random()*8));
  const now = performance.now();
  rods.forEach((r,i) => {
    r.anim = {from: r.angle, to: targetAngle(r.angle, picks[i], 4+i), t0: now, dur: 1600 + i*550};
  });
  requestAnimationFrame(loop);
  setTimeout(() => {
    mainReading = makeReading(picks.map(k => FACES[k]));
    spinning = false;
    $('castBtn').disabled = $('coinBtn').disabled = false; $('hint').textContent = '';
    renderSide('side', () => mainReading, 'cap');
    $('side').classList.add('on');
  }, 1600 + 5*550 + 120);
}
$('castBtn').onclick = cast;
let ty = null, tx = null;
$('main').addEventListener('touchstart', e => { ty = e.touches[0].clientY; tx = e.touches[0].clientX; }, {passive:true});
$('main').addEventListener('touchend', e => {
  if (ty === null) return;
  const dy = e.changedTouches[0].clientY - ty, dx = e.changedTouches[0].clientX - tx; ty = null;
  if (dy < -60 && Math.abs(dx) < 120 && !$('sheet').classList.contains('on')) cast();
}, {passive:true});
document.addEventListener('touchmove', e => { if (!e.target.closest('.pb')) e.preventDefault(); }, {passive:false});

/* ---------- 側邊按鈕與卦名短語 ---------- */
function renderSide(sideId, getR, capId){
  const s = $(sideId);
  s.innerHTML = '';
  [['名','卦名','cap'],['辭','卦辭','judg'],['爻','爻辭','yao'],['變','變卦','chg']].forEach(([ch,lab,kind]) => {
    const b = document.createElement('button'); b.className = 'sb';
    b.innerHTML = `<b>${ch}</b>${lab}`;
    b.onclick = () => {
      const r = getR(); if (!r) return;
      if (kind === 'cap') { toggleCap(capId, r); return; }
      openSheet(kind, r);
    };
    s.appendChild(b);
  });
}
function toggleCap(capId, r){
  const c = $(capId);
  if (c.classList.contains('on')) { c.classList.remove('on'); return; }
  const row = (h, sub) => `<div class="row${sub?' sub':''}">${sub?'<span class="tag">之</span>':''}<span class="nm">${h.sym} ${esc(fullName(h))}</span><span class="mn">${esc(h.meaning)}</span></div>`;
  c.innerHTML = row(r.prim) + (r.chg ? row(r.chg, true) : '');
  c.classList.add('on');
}
