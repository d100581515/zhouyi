/* ---------- 面板 ---------- */
function glyph(lines, ch){
  let s = '<div class="glyph">';
  for (let i=5;i>=0;i--){
    const y = lines[i] === 1, mk = ch && ch.includes(i) ? (y ? '○' : '×') : '';
    s += `<div class="g"><div class="ln">${y ? '<i></i>' : '<i></i><i></i>'}</div><s>${mk}</s></div>`;
  }
  return s + '</div>';
}
function header(h, role, ch){
  return `<div class="hh">${glyph(h.lines, ch)}<div>${role?`<div class="role">${role}</div>`:''}
    <div class="t">第${h.n}卦　${esc(fullName(h))}</div><div class="m">${esc(h.meaning)}</div>
    <div class="tr">上${h.upper}下${h.lower}・${NATURE[h.upper]}${NATURE[h.lower]}</div></div></div>`;
}
function card(title, o, hi, badge){
  return `<div class="card${hi?' hi':''}"><div class="ct">${esc(title)}${badge?`<em>${badge}</em>`:''}</div>
    <div class="tx">${esc(o.text)}</div><div class="lb"><span>白話</span><div>${esc(o.plain)}</div></div>
    ${o.insight?`<div class="lb"><span>引申</span><div>${esc(o.insight)}</div></div>`:''}</div>`;
}
const more = h => `<a class="more" href="index.html#g${h.n}">閱讀〈${esc(fullName(h))}〉全文與朱注 →</a>`;
function info(h, role, ch){
  return header(h, role, ch) + card('卦辭', h.judgment) + card('大象', h.image) + more(h);
}
function openSheet(kind, r){
  let html = '', title = '';
  if (kind === 'judg') { title = '卦辭'; html = info(r.prim, '本卦', r.ch); }
  if (kind === 'yao') {
    title = '爻辭';
    const g = guidance(r);
    html = header(r.prim, '本卦', r.ch) +
      `<div class="sec-t" style="color:var(--acc)">朱子占法</div><div class="rule">${g.rule}</div>` +
      g.items.map(it => card(it.title, it, true)).join('') +
      `<div class="sec-t">本卦六爻</div>` +
      r.prim.yao.map((y,i) => { const c = i < 6 ? r.ch.includes(i) : r.ch.length === 6; return card(y.pos, y, c, c ? '變' : ''); }).join('') +
      more(r.prim);
  }
  if (kind === 'chg') {
    title = '變卦';
    if (!r.chg) html = header(r.prim, '本卦') + '<p class="note" style="text-align:center">六爻皆不變，沒有變卦。<br>依朱子占法，以本卦卦辭為占。</p>';
    else {
      const mini = (h, tag, ch) => `<div class="mini"><small style="color:var(--acc)">${tag}</small>${glyph(h.lines, ch)}<b>${esc(fullName(h))}</b><small>${esc(h.meaning)}</small></div>`;
      html = `<div class="cmp">${mini(r.prim,'本卦',r.ch)}<span class="ar">→</span>${mini(r.chg,'之卦',[])}</div>
        <p class="note">變爻：${r.ch.map(i => r.prim.yao[i].pos).join('、')}</p>` + info(r.chg, '之卦（變卦）');
    }
  }
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = html; $('sheetBody').scrollTop = 0;
  const s = $('sheet'); s.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('show')));
}
function closeSheet(){
  const s = $('sheet'); s.classList.remove('show'); setTimeout(() => s.classList.remove('on'), 300);
}
$('sheetDone').onclick = closeSheet; $('sheetBd').onclick = closeSheet;

/* ---------- 銅錢 ---------- */
const COIN = 96, CANVAS_H = 172;
function coinFace(front){
  const D = 192, cv = document.createElement('canvas'); cv.width = cv.height = D;
  const c = cv.getContext('2d'), m = D/2, hole = D*.30;
  const g = c.createRadialGradient(D*.4,D*.35,D*.05,m,m,D*.62);
  g.addColorStop(0,'#d4a861'); g.addColorStop(.55,'#a87a3d'); g.addColorStop(1,'#66451c');
  c.fillStyle = g; c.beginPath(); c.arc(m,m,m,0,Math.PI*2); c.rect(m-hole/2,m-hole/2,hole,hole); c.fill('evenodd');
  const relief = 'rgba(77,48,18,.88)';
  c.strokeStyle = relief; c.lineWidth = D*.035; c.beginPath(); c.arc(m,m,m-D*.0525,0,Math.PI*2); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = D*.01; c.beginPath(); c.arc(m,m,m-D*.017,0,Math.PI*2); c.stroke();
  const hh = hole + D*.05; c.strokeStyle = relief; c.lineWidth = D*.03; c.strokeRect(m-hh/2,m-hh/2,hh,hh);
  c.fillStyle = relief;
  if (front) {
    c.font = `900 ${D*.21}px "Kaiti TC","STKaiti","BiauKai","Songti TC","Noto Serif CJK TC",serif`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    const r = D*.32;
    [['乾',0,-r],['隆',0,r],['通',r,0],['寶',-r,0]].forEach(([ch,x,y]) => {
      c.fillStyle = 'rgba(255,255,255,.3)'; c.fillText(ch, m+x-.8, m+y-.8);
      c.fillStyle = relief; c.fillText(ch, m+x, m+y);
    });
  } else {
    for (let k=0;k<4;k++){
      const a = Math.PI/4 + k*Math.PI/2, ux = Math.cos(a), uy = Math.sin(a), px = -uy, py = ux;
      const pt = (al, sd) => [m+ux*al+px*sd, m+uy*al+py*sd];
      const inner = D*.235, tip = D*.39, mid = (inner+tip)/2;
      c.lineWidth = D*.018; c.beginPath(); c.moveTo(...pt(inner,0));
      c.quadraticCurveTo(...pt(mid,-D*.085), ...pt(tip,0)); c.quadraticCurveTo(...pt(mid,D*.085), ...pt(inner,0)); c.stroke();
      c.lineWidth = D*.01; c.beginPath(); c.moveTo(...pt(inner+D*.03,0)); c.lineTo(...pt(tip-D*.05,0)); c.stroke();
      const b = pt(tip+D*.02,0); c.beginPath(); c.arc(b[0],b[1],D*.022,0,Math.PI*2); c.fill();
    }
    for (let k=0;k<4;k++){ const a = k*Math.PI/2; c.beginPath(); c.arc(m+Math.cos(a)*D*.33, m+Math.sin(a)*D*.33, D*.025, 0, Math.PI*2); c.fill(); }
  }
  return cv;
}
let FRONT = null, BACK = null;
const coins = [0,1,2].map(i => {
  const cv = document.createElement('canvas'); $('coins').appendChild(cv);
  return {cv, angle: i === 1 ? 180 : 0, anim: null, g: null};
});
function drawCoin(co){
  const {ctx, w, h} = co.g; ctx.clearRect(0,0,w,h);
  const rad = co.angle*Math.PI/180, cs = Math.cos(rad);
  let lift = 0;
  if (co.anim) { const p = Math.min(1,(performance.now()-co.anim.t0)/co.anim.dur); lift = Math.sin(p*Math.PI) * 70; }
  const cx = w/2, cy = h - COIN/2 - 6 - lift, sy = Math.max(Math.abs(cs), .06);
  // 影子
  ctx.fillStyle = `rgba(0,0,0,${.22 - lift*.0018})`;
  ctx.beginPath(); ctx.ellipse(cx, h-6, COIN*.42*(1-lift*.003), 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(cx, cy); ctx.scale(1, sy);
  ctx.drawImage(cs >= 0 ? FRONT : BACK, -COIN/2, -COIN/2, COIN, COIN);
  ctx.restore();
}
function coinLoop(now){
  let active = false;
  coins.forEach(co => {
    if (co.anim){
      const p = Math.min(1,(now-co.anim.t0)/co.anim.dur);
      co.angle = co.anim.from + (co.anim.to-co.anim.from)*easeOut(p);
      drawCoin(co);
      if (p >= 1) co.anim = null; else active = true;
    }
  });
  if (active) requestAnimationFrame(coinLoop);
}
let coinYaos = [], tossing = false;
const isFront = a => Math.cos(a*Math.PI/180) >= 0;
function renderBuild(popLast){
  let s = '';
  for (let i=5;i>=0;i--){
    if (i < coinYaos.length){
      const v = coinYaos[i];
      s += `<div class="slot fill${popLast && i === coinYaos.length-1 ? ' pop' : ''}"><div class="ln">${isYang(v)?'<i></i>':'<i></i><i></i>'}</div><div class="mk">${v===9?'○':v===6?'×':''}</div></div>`;
    } else s += '<div class="slot"><div class="ln empty"></div><div class="mk"></div></div>';
  }
  $('build').innerHTML = s;
  const n = coinYaos.length;
  $('coinHint').textContent = n === 6 ? '卦成' : `第 ${n+1} 擲：${POS[n]}爻（點銅錢或下方按鈕）`;
  $('tossBtn').textContent = n === 6 ? '重新起卦' : '擲銅錢';
}
let coinReading = null;
function toss(){
  if (tossing) return;
  if (coinYaos.length === 6) {             // 重新起卦
    coinYaos = []; coinReading = null; $('coinSide').classList.remove('on'); $('coinCap').classList.remove('on');
    renderBuild(); return;
  }
  tossing = true; $('tossBtn').disabled = true; $('coinHint').textContent = '……';
  const faces = [0,1,2].map(() => Math.random() < .5);     // true = 字面（陽）
  const now = performance.now(); let maxDur = 0;
  coins.forEach((co,i) => {
    let half = 6 + Math.floor(Math.random()*4);
    if ((half % 2 === 0) !== (isFront(co.angle) === faces[i])) half++;
    const dur = 900 + Math.random()*400; maxDur = Math.max(maxDur, dur);
    co.anim = {from: co.angle, to: co.angle + half*180, t0: now, dur};
  });
  requestAnimationFrame(coinLoop);
  setTimeout(() => {
    coinYaos.push(faces.reduce((s,f) => s + (f ? 3 : 2), 0));
    tossing = false; $('tossBtn').disabled = false;
    renderBuild(true);
    if (coinYaos.length === 6) {
      coinReading = makeReading(coinYaos);
      renderSide('coinSide', () => coinReading, 'coinCap');
      $('coinSide').classList.add('on');
    }
  }, maxDur + 150);
}
$('tossBtn').onclick = toss;
$('coins').onclick = () => { if (coinYaos.length < 6) toss(); };
$('coinBtn').onclick = () => {
  $('main').classList.remove('on'); $('coinView').classList.add('on');
  coinYaos = []; coinReading = null; $('coinSide').classList.remove('on'); $('coinCap').classList.remove('on');
  renderBuild(); layoutCoins();
};
$('coinClose').onclick = () => { $('coinView').classList.remove('on'); $('main').classList.add('on'); layoutRods(); };
function layoutCoins(){
  if (!FRONT) { FRONT = coinFace(true); BACK = coinFace(false); }
  coins.forEach(co => { co.g = fitCanvas(co.cv); drawCoin(co); });
}

/* ---------- 啟動 ---------- */
window.addEventListener('resize', () => { layoutRods(); if ($('coinView').classList.contains('on')) layoutCoins(); });
const start = () => layoutRods();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
start();
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__qigua = {makeReading, guidance, targetAngle, FACES, cast, toss, get mainReading(){return mainReading}, get coinReading(){return coinReading}};
})();
</script>
